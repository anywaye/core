version: 1
name: core

gate:
  command: [bin/prime]
  miseTask: prime
  entrypoint: bin/prime
  timeoutSeconds: 900
  proof:
    - id: suite
      match: '^([0-9]+)/[0-9]+ passed$'
      minimum: 310
external:
  selfContained: false
  requirements:
    - kind: toolchain
      name: CPython that can create a venv, and mise to install the pinned 3.14
      satisfy:
        command: [mise, install]
        unmet: bin/prime exits 127 out of tests/setup.sh with "python3 -m venv" in the message
    - kind: network
      name: PyPI, ONCE, on a cold checkout only — jsonschema, PyYAML, pytest and their pins
      satisfy:
        command: [tests/setup.sh]
        unmet: tests/.venv/bin/python does not exist after bin/prime has run

ci:
  workflow: ci/gate.sh
  invokes: [bin/prime]
