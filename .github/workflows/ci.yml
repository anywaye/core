---
# core's CI: kit's reusable workflow, plus the half kit cannot own.
#
# READ THIS BEFORE TRIAGING A RED BUILD HERE.
#
#   **A red in `core` is not "core is broken". It is "a rule the fleet depends
#   on no longer holds".**
#
# core publishes no service and no API. It owns the event envelope, the
# manifest schema, the per-event payload schemas and — since core-05 — the
# telemetry signal schemas. `tests/test_specs.py` is the *enforcement mechanism*
# for every rule the platform has: a convention that is not a JSON Schema
# constraint plus a test is documentation of a wish.
#
# Six other repositories' contract tests consume these schemas, and they vendor
# them. So core's gate failing and core's gate passing are not the same
# severity, and they are not the same *kind* of event:
#
#   - a red here is a spec regression until proven otherwise. Escalate it as one.
#     Do not file it as a docs nit, and do not "fix" it by loosening a test:
#     there is no weaker assertion available here that is not a lie.
#   - a green here means six services agree with a contract they did not write.
#     It does not mean there was nothing to check — see `gate` below, which runs
#     the same suite twice through two different entry points and fails if they
#     disagree about how many tests exist.
#
# The two jobs are two different claims, and the job names are the claims:
#
#   kit   kit's workflow resolves from core, and core's gate bootstraps from
#         nothing on a clean runner. Proves the adoption. Runs on whatever
#         interpreter the runner image ships — see the note on that job.
#   gate  THE gate: the repository's own `bin/prime`, on the pinned interpreter,
#         plus the pytest entry point, plus the drift guards.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Kept explicit rather than inferred, so a caller adding a trigger can see the
  # list that exists without reading git history.
  workflow_dispatch:

permissions:
  # Read-only, and the whole workflow needs nothing else: the gate is hermetic
  # and reaches no cafaye service, so there is no secret to inherit and no
  # reason to hold one.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------- shared half
  kit:
    name: kit (adoption + clean-runner bootstrap)
    # The `uses:` is the whole job. `.github/workflows/` in that path is not
    # decoration: GitHub resolves a reusable workflow at
    # `{owner}/{repo}/.github/workflows/{file}@{ref}` and documents that
    # **subdirectories of the workflows directory are not supported**. kit-02
    # shipped the file at `workflows/ci.reusable.yml`, so that path resolved to
    # nothing and **no repository in the fleet was calling it** — nothing
    # detected the disagreement, because a layout bug and a documentation bug
    # agree with each other perfectly. kit-04 moved the file; this line is
    # written out in full rather than aliased so that a future move is a
    # one-line diff someone can see.
    uses: cafaye/kit/.github/workflows/ci.reusable.yml@master
    with:
      # `none`, not `python`, and the difference is not cosmetic: `none` is
      # kit's documented option "for a repository with **no service manifest at
      # all**", which is exactly what core is. The seven language jobs are not
      # merely inapplicable here, they are *red on arrival* — `python` opens
      # with `uv sync --frozen`, which exits 2 with "No pyproject.toml found"
      # in a repository that has never had one and should not.
      #
      # The job then runs `tests/validate.sh`, which is a three-line exec of
      # `bin/prime`. There is still one gate and one suite: this is not a
      # second gate, it is the same command under the filename kit's contract
      # looks for.
      #
      # `test_core_declares_no_service_manifest` is what keeps that honest. If it
      # ever fails, this `language:` is wrong.
      language: 'none'
      # The directory holding the gate. `.`, because there is no manifest to
      # point at — core's only executable is `tests/test_specs.py` at the root.
      working-dir: .

  # ---------------------------------------------------------- service half
  gate:
    name: gate (bin/prime, pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The pin is read from `mise.toml`, not written here, and the next step
      # asserts the interpreter that arrived is the one the repository declares.
      #
      # Why not `python-version-file: mise.toml`, which reads as if it should
      # work: `actions/setup-python` dispatches a `.toml` file to a reader that
      # looks for `project.requires-python`, else `tool.poetry.dependencies.python`,
      # and mise's `[tools]` is neither. It resolves to nothing and installs
      # nothing, **silently** — no error, no warning, no interpreter. That trap
      # is why the assertion below exists rather than a second copy of the
      # version: a literal would have been the more boring file and would have
      # been trusted.
      #
      # `tomllib` is stdlib from 3.11 and the runner's own `python3` provides it,
      # so this step needs no toolchain of its own. Deliberately *before*
      # setup-python, because setup-python is what this step is telling.
      - name: the pin is core's, and it is mise.toml that holds it
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re
          import tomllib

          tools = tomllib.loads(
              pathlib.Path("mise.toml").read_text(encoding="utf-8")
          )["tools"]
          version = tools["python"]
          # Written as a plain number because setup-python takes a version
          # *specifier* here, and mise pins allow prefixes ("3.14", "~=3.14").
          # A specifier would install the newest matching interpreter, which is
          # exactly the "depends on which image was cached" failure this pin
          # exists to prevent — so the minor is what CI runs on.
          if not re.fullmatch(r"\d+\.\d+", version):
              raise SystemExit(
                  f"::error::mise.toml pins python {version!r}, which is not a plain "
                  "major.minor. CI needs a concrete minor; raise it deliberately."
              )
          print(f"python={version}")
          PY
          echo "core pins python $(cat "$GITHUB_OUTPUT" | cut -d= -f2) in mise.toml"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pin.outputs.python }}

      - name: the interpreter that arrived is the pin
        # The guard that earns the step above its keep. A pin nobody checks is a
        # comment: this reads the pin again, from the same file, and compares it
        # to what is actually running. If setup-python ever stops honouring the
        # input, or mise.toml and the workflow ever stop agreeing, this goes red
        # in seconds and names the number that broke the claim.
        shell: bash
        env:
          PINNED: ${{ steps.pin.outputs.python }}
        run: |
          set -euo pipefail
          running="$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          if [ "$running" != "$PINNED" ]; then
            echo "::error::mise.toml pins python $PINNED; CI is running $running." >&2
            exit 1
          fi
          echo "::notice::running the interpreter mise.toml declares: python $running"

      - name: bin/prime — the gate
        # `bin/prime`, not a CI-only variant of it, and not `python -m pytest`.
        # Two reasons, and the first is the load-bearing one:
        #
        #   1. `bin/prime` creates `tests/.venv` when it is missing. **Creating
        #      the venv is part of the gate.** A CI job that installs the
        #      dependencies itself and then runs the suite is a *second*
        #      implementation of the gate, and it will drift — the day
        #      `tests/setup.sh` changes what it installs, the CI path keeps
        #      installing what it installed yesterday. The venv is gitignored, so
        #      on a fresh runner it genuinely does not exist, which is exactly
        #      the bootstrap this job needs to exercise.
        #   2. It is the command a developer runs, which is the only way the two
        #      can be known to agree. If they can disagree, one of them is lying.
        #
        # Step two of it checks core's own `gate.yml` — the STATIC half. The
        # proving half is the next step, and it has to be a separate one: the
        # proving half runs the gate, and the gate runs the static half.
        #
        # `bin/prime` ALSO runs the gate checker's own red proof, and this step
        # still runs it separately, which used to look redundant and is not: the
        # step below produces a log whose every case line is attributable to this
        # job, so a red proof failure is one grep away rather than buried in the
        # gate's output. The local run is for the developer; this one is for the
        # build.
        #
        # `tee` keeps the whole log and the next step reads it; `set -o pipefail`
        # (with `shell: bash`) keeps a red suite red through the pipe.
        shell: bash
        run: |
          set -euo pipefail
          bin/prime 2>&1 | tee "$RUNNER_TEMP/prime.log"

      - name: the gate ran, and proved it
        # The PROVING half of `harness/gate_check.py`, and the only step in this
        # workflow that can catch a **false green**.
        #
        # `bin/prime` above cannot do this, and the reason is worth stating
        # because it is structural rather than a matter of arrangement: the
        # checker runs the declared gate, and the gate runs the checker. A gate
        # that verifies itself by running itself terminates, and the termination
        # is the only thing it would have proved. So the static half lives in
        # `bin/prime` and the proving half lives here.
        #
        # What it adds: the gate's output is matched against the
        # `gate.proof` patterns in `gate.yml`, with a floor. An exit code of 0
        # on its own is not accepted — `gate.proof-missing` is a FAILURE. That
        # is the difference between this step and `bin/prime | tail`, and it is
        # the difference between a green badge and a claim somebody checked.
        #
        # The gate's own output goes to a log and is not printed: a CI log is
        # kept forever and read by people who were not there.
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/gate_check.py --prove --log-dir "$RUNNER_TEMP" .

      - name: the gate checker can fail — its own red proof
        # The second tier for the checker, and the same rule as the harness
        # self-test below: eighteen deliberate breakages, each asserting the
        # checker goes red AND names the finding it expects, plus a control on
        # the unbroken fixture that runs first. Seven warning cases assert the
        # exit code stays 0; twelve real `run:` spellings assert the checker
        # ACCEPTS them; three green cases and two colour reds cover the ANSI
        # stripping; four extractor assertions and a leak case.
        #
        # `bin/prime` runs this too, as of core-14 — a local gate that could not
        # show the checker failing was weaker than this step, and nothing said
        # so. It still runs as a step of its own here for the log. It is NOT the
        # recursion the static half avoids, because it runs fixture repositories
        # and never `bin/prime`; `test_bin_prime_runs_the_gate_checkers_red_proof`
        # and `test_every_gate_finding_is_proved_able_to_go_red` in
        # `tests/test_specs.py` fail if this step is deleted, if that one is
        # deleted, or if a finding has no breakage naming it.
        shell: bash
        run: |
          set -euo pipefail
          bash harness/tests/gate_self_test.sh 2>&1 | tee "$RUNNER_TEMP/gate-self-test.log"

      - name: the tenancy checker can fail — its own red proof
        # The second tier for the tenancy checker, and the same rule as the two
        # steps above it: a self-test CI never invokes is not a test, and a
        # comment claiming CI runs it is not CI running it.
        #
        # Twenty-eight deliberate breakages across three fixtures — a conforming
        # service, an honest zero, and a service written in a language the
        # scanner cannot read. Each asserts the checker goes red AND names both
        # the finding and the entry point or table it fired about; four assert
        # that a WARNING stays green; two assert the report names what the
        # checker cannot see. The control runs first and is asserted
        # warning-free.
        #
        # Twenty-eight breakages and twenty-four failures, because two cases prove
        # an arm of a finding rather than a finding of its own, and the database
        # half is the one the packet added. One of them is its headline: deleting
        # the single `alter table … force row level security;` line must produce
        # `tenancy.rls-owner-bypass` about that table and about nothing else.
        #
        # Its own script rather than a section of the gate checker's, for the
        # reason that script's header gives: the two checkers have different
        # fixtures, different findings and different failure modes, and one
        # script asserting both would make a red in one indistinguishable from a
        # red in the other.
        #
        # Deliberately NOT inside `bin/prime`, and see the report for why that
        # is a hand-off rather than an omission: `bin/prime` does not yet run
        # ANY self-test script (gate, harness or tenancy), which is one decision
        # owed in one place rather than three.
        shell: bash
        run: |
          set -euo pipefail
          bash harness/tests/tenancy_self_test.sh 2>&1 | tee "$RUNNER_TEMP/tenancy-self-test.log"

      - name: the db-isolation guard can fail — its own red proof
        # `bin/prime` already runs this self-test and reads its report, so this
        # step is the SECOND reader rather than the only one. It is here for the
        # reason the two steps above it are: a self-test CI never invokes is not
        # a test, and `bin/prime` is a script a developer runs on a machine where
        # nothing is watching whether its second half ran.
        #
        # EIGHT cases against THREE fixtures, and the five clean controls are the
        # reason the three reds mean anything. A guard that reports darkroom --
        # the one repository in the fleet that has FIXED this defect -- as
        # carrying it is switched off, and being switched off is how the next
        # service gets it.
        shell: bash
        run: |
          set -euo pipefail
          bash harness/tests/db_isolation_self_test.sh 2>&1 | tee "$RUNNER_TEMP/db-isolation-self-test.log"

      - name: the numeric checker can fail — its own red proof
        # The second tier for the numeric checker, and the same rule as the two
        # steps above it: a self-test CI never invokes is not a test, and a
        # comment claiming CI runs it is not CI running it.
        #
        # Nine cases against two fixtures and core's OWN schemas: four
        # breakages that go red and name both the finding and the field, two
        # warnings that stay green with the exit code unmoved, a green asserting
        # the boundary from the other side (2**53 - 1) plus a malformed document
        # reported as unread, and two not-enforced cases asserting
        # `numeric.unsigned` stayed green AND is in the ledger — against the
        # fixture and against core's 31 real positions. The control runs first
        # and is asserted WARNING-FREE, not merely green: a control that arrives
        # already complaining cannot tell a conforming surface from one the
        # checker has an opinion about.
        #
        # Deliberately NOT inside `bin/prime`, which DOES run the check itself
        # and must keep doing so — the check is a fact about this tree a developer
        # who has just edited a schema needs to learn now, and the red proof runs
        # assertions about the checker against copies of a twenty-line fixture. A
        # self-test inside every gate invocation would be a second gate that can
        # disagree with the first.
        shell: bash
        run: |
          set -euo pipefail
          bash harness/tests/numeric_self_test.sh 2>&1 | tee "$RUNNER_TEMP/numeric-self-test.log"

      - name: the account-scope checker can fail — its own red proof
        # The third tier of the same rule: a self-test CI never invokes is not a
        # test, and a comment claiming CI runs it is not CI running it.
        #
        # TWENTY-FOUR cases against THREE fixtures and one generated in place:
        # seventeen breakages that go red naming their finding, seven that stay
        # clean, and the control first among all of them. Three of the clean cases are load-bearing rather than
        # decorative and they are the negative controls for the three ways this
        # checker could cry wolf:
        #
        #   * a Phoenix `scope "/v1"` above `get "/x"`, with every route declared
        #     by its FULL caller-visible path — a checker that resolved the prefix
        #     would report courier's real router as a wall of `undeclared`;
        #   * `:id` declared where the code writes `{id}`, which is what five
        #     languages and four frameworks between them actually spell;
        #   * a route written in a COMMENT, which is what identity's own router
        #     does to the routes it removed;
        #   * `site`'s own Next.js catch-all, where the path is in the FILE NAME —
        #     a checker that could not read it would report two of the three
        #     repositories in scope as having no routes at all.
        #
        # A guard that reports a correct Phoenix router as unscoped is switched off
        # within a week, and being switched off is how the cross-tenant read gets
        # through next time.
        #
        # Deliberately NOT inside `bin/prime`, which runs the checker's siblings'
        # red proofs but not this one: the placement split is documented in
        # `bin/prime`'s own header, and moving a red proof into every gate
        # invocation makes it a second gate that can disagree with the first.
        shell: bash
        run: |
          set -euo pipefail
          bash harness/tests/account_scope_self_test.sh 2>&1 | tee "$RUNNER_TEMP/account-scope-self-test.log"

      - name: the numeric self-test said what it did
        # The log is READ, not merely produced — the same rule as the step
        # below and the two count comparisons further down. A footer asserting
        # every breakage went red is a *claim* until something checks it against
        # the lines above it, and a pattern matching nothing is an error rather
        # than a pass: a guard that cannot find its target is not a guard.
        #
        # The floor is 4 because that is what the script prints, and the check
        # is `>=` for the reason the gate step's is: a new kind of case adds a
        # line without lowering the tally, and this step should not need editing
        # for that. A shortfall is the direction that matters.
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/numeric-self-test.log"
          red="$(grep -E '^  breakages that went RED' "$log" | grep -E ': [0-9]+$' | awk '{print $NF}')"
          skipped="$(grep -E '^  SKIPPED' "$log" | grep -E ': [0-9]+$' | awk '{print $NF}')"
          if [ -z "$red" ] || [ -z "$skipped" ]; then
            echo "::error::the numeric self-test exited 0 without reporting its counts." >&2
            exit 1
          fi
          if [ "$red" -lt 4 ]; then
            echo "::error::the numeric self-test counted $red breakages; the floor is 4." >&2
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "::error::the numeric self-test reported $skipped skipped cases. A skip is a" >&2
            echo "  claim this machine could not settle, and a case that could not run is" >&2
            echo "  reported or it is not counted." >&2
            exit 1
          fi
          if ! grep -qE '^PASS numeric_self_test: the control' "$log"; then
            echo "::error::the counts block claims a control and no control printed its PASS line." >&2
            exit 1
          fi
          logged="$(grep -cE '^PASS numeric_self_test:' "$log" || true)"
          echo "::notice::the numeric self-test: $red breakages red, $logged PASS lines, 0 skipped."

      - name: the tenancy self-test said what it did
        # The log is read, not merely produced — the same rule the harness
        # self-test step below already applies, and for the same reason: a
        # footer asserting every breakage went red is a *claim* until something
        # checks it against the lines above it.
        #
        # A pattern that matches nothing is an error rather than a pass, which
        # is the same "a guard that cannot find its target is not a guard" rule
        # the two count-comparison steps below already use.
        shell: bash
        run: |
          set -euo pipefail
          # `|| true` on the pipeline is load-bearing, not defensive noise, and
          # this was found by RUNNING this step against a doctored log rather
          # than by reading it: under `set -e` a command substitution whose
          # pipeline exits nonzero kills the step outright, and `grep` exits 1
          # when it matches nothing. Without it the "the self-test never reported
          # that every breakage went red" error below is UNREACHABLE, and a
          # silently-broken self-test surfaces as a bare `exit 1` with no
          # message — the least diagnosable failure available. The step the
          # harness self-test uses has the same guard and the same reason.
          claimed="$(grep -oE 'breakages went red naming their finding' \
            "$RUNNER_TEMP/tenancy-self-test.log" | wc -l | tr -d ' ' || true)"
          logged="$(grep -cE '^PASS tenancy_self_test: breakage' "$RUNNER_TEMP/tenancy-self-test.log" || true)"
          controls="$(grep -cE '^PASS tenancy_self_test: the control' "$RUNNER_TEMP/tenancy-self-test.log" || true)"

          if [ "$claimed" -ne 1 ]; then
            echo "::error::the tenancy self-test never reported that every breakage went red." >&2
            tail -5 "$RUNNER_TEMP/tenancy-self-test.log" >&2
            exit 1
          fi
          if [ "$controls" -ne 1 ]; then
            echo "::error::the tenancy self-test ran its control $controls times; it runs once, first." >&2
            exit 1
          fi
          if [ "$logged" -lt 1 ]; then
            echo "::error::the tenancy self-test logged no breakage assertions." >&2
            tail -5 "$RUNNER_TEMP/tenancy-self-test.log" >&2
            exit 1
          fi
          echo "::notice::tenancy self-test: control green, $logged breakages red, warnings stayed green."

      - name: the gate left the tree byte-identical
        # `git diff --exit-code` over the whole tracked tree.
        #
        # The rule this implements is kit's: *a `git diff --exit-code` guard on
        # any lockfile your gate can move*. core has no lockfile — no
        # `Gemfile.lock`, `go.sum`, `uv.lock`, `mix.lock` or `Cargo.lock`, and
        # `tests/requirements.txt` is read by pip and never written by it — so
        # there is no named file to guard and the honest form of the rule is the
        # generalisation: **the gate must not write to the specification at
        # all.**
        #
        # That is not a formality here. core is the tree six services *vendor*.
        # A gate that could rewrite a schema, an example, or a doc would put
        # un-reviewed bytes into every one of them, and `git diff` is the only
        # thing standing between a careless step and a fleet-wide silent change.
        # It also catches the future: the day a tier starts caching into the
        # tree, this is what notices.
        run: git diff --exit-code

      - name: the harness can fail — its own self-test
        # The second tier, and PLAN.md §1 is explicit about what a second tier
        # owes: **CI must invoke it.** A comment claiming CI runs the self-test
        # is not CI running it, and that is the whole lesson of the four
        # repositories that shipped a check which skipped instead of failing —
        # guard's live-Redis tier, muse's `MUSE_CORE_SCHEMAS` tier, identity's
        # `TEST_DATABASE_URL` tier, darkroom's `--ignored` tests.
        #
        # `harness/tests/self_test.sh` makes twenty deliberate breakages, each
        # asserting the harness goes red *and names the rule it expected*, plus a
        # control on the unbroken tree that runs first.
        #
        # It is deliberately not inside `bin/prime`, and that is now an asymmetry
        # rather than an oversight: core-14 put the GATE CHECKER's red proof in
        # `bin/prime` because a developer running the gate must know the checker
        # can fail, and left this one out because it is a different checker on a
        # different schedule — 28 breakages of `cafaye_contract.py`, whose answer
        # does not depend on how `bin/prime` was invoked. It is a documented
        # command a developer can run, and this step runs the same one. The
        # reasoning and the cost are in docs/gate.md.
        #
        # The copies are throwaway and the worktree is not touched. The
        # `git diff` step above would catch a mutation here, but only after the
        # fact and only in the tree; the self-test is designed not to need that.
        shell: bash
        run: |
          set -euo pipefail
          bash harness/tests/self_test.sh 2>&1 | tee "$RUNNER_TEMP/self-test.log"

      - name: the self-test said what it did
        # The log is read, not merely produced. A footer asserting every breakage
        # went red is a *claim* until something checks it against the lines
        # above, so this compares the count the footer claims with the number of
        # assertions actually logged, and requires the control to have run
        # exactly once.
        #
        # A pattern that matches nothing is an error rather than a pass — the same
        # rule the test-count comparison further down follows, for the same
        # reason: a guard that cannot find its target is not a guard.
        shell: bash
        run: |
          set -euo pipefail
          # The phrase here was `all [0-9]+ breakages went red`, and the footer has
          # never emitted it: it prints `PASS: self_test — N breakages went red
          # naming their rule`. So `claimed` was empty on every run, the
          # `[ -z "$claimed" ]` guard below was always true, and this step exited 1
          # on a self-test that had passed. A guard that cannot find its target is
          # not a guard, and this one was not failing open — it was failing on
          # purpose for a reason nobody could see, which is the worst of the three
          # shapes.
          #
          # It is fixed here and pinned by
          # `test_the_ci_self_test_step_reads_the_phrase_the_footer_prints` in
          # `tests/test_specs.py`, which greps THIS file for the literal the
          # footer emits and fails if the two ever stop agreeing. Without that
          # test the two strings drift again, and the drift is invisible: the
          # step goes red with a message about a self-test that passed, and the
          # first hypothesis a reader reaches for is the self-test.
          claimed="$(grep -oE 'PASS: self_test — [0-9]+ breakages went red' \
            "$RUNNER_TEMP/self-test.log" | tail -1 | grep -oE '[0-9]+' || true)"
          logged="$(grep -cE '^PASS self_test: breakage' "$RUNNER_TEMP/self-test.log" || true)"
          controls="$(grep -cE '^PASS self_test: the control' "$RUNNER_TEMP/self-test.log" || true)"

          if [ -z "$claimed" ]; then
            echo "::error::the self-test never reported that every breakage went red." >&2
            tail -5 "$RUNNER_TEMP/self-test.log" >&2
            exit 1
          fi
          if [ "$controls" -lt 1 ]; then
            echo "::error::the self-test ran no control; the breakages below it prove nothing." >&2
            exit 1
          fi
          # "at least one control" replaced "exactly one control" in core-18, and
          # the reason is worth recording because the weaker-looking assertion is
          # the stronger one. There are now FOUR controls: the original
          # `conforming` fixture, `conforming-openapi`, and the two postgres-pin
          # fixtures — one of which proves the scanner does not read a DSN as an
          # image reference, and one of which proves a *declared* exception is
          # honoured. A check that hard-codes a control count fails the moment a
          # packet adds a fixture that needed its own control, and the fix an
          # engineer reaches for at 2am is to delete the assertion.
          #
          # The claim this step actually cares about is ORDER: a control that runs
          # after a breakage has not controlled it, because a tree that was
          # already red makes every "the harness went red" below it vacuous. That
          # is asserted directly — the first control line must precede the first
          # breakage line — and it is a property of the log rather than a number
          # someone has to remember to bump.
          first_control="$(grep -nE '^PASS self_test: the control' "$RUNNER_TEMP/self-test.log" |
            head -1 | cut -d: -f1 || true)"
          first_breakage="$(grep -nE '^PASS self_test: breakage' "$RUNNER_TEMP/self-test.log" |
            head -1 | cut -d: -f1 || true)"
          if [ -z "$first_control" ] || [ -z "$first_breakage" ]; then
            echo "::error::could not locate a control or a breakage line in the log." >&2
            exit 1
          fi
          if [ "$first_control" -gt "$first_breakage" ]; then
            echo "::error::the first control (line $first_control) runs after the first" >&2
            echo "  breakage (line $first_breakage). Every breakage below it is" >&2
            echo "  vacuous against a tree that was already red." >&2
            exit 1
          fi
          # `logged >= claimed` rather than `==`: breakage 8 is one mutation
          # asserting two rules, because the two are structurally coupled. Fewer
          # assertions than breakages is a script that stopped breaking things;
          # more is a new breakage, and this step should not need editing for it.
          if [ "$logged" -lt "$claimed" ]; then
            echo "::error::the self-test claims $claimed breakages and logged $logged assertions." >&2
            exit 1
          fi
          echo "::notice::self-test: $controls controls green (the first at line $first_control, before any breakage), $logged breakage assertions red, $claimed breakages claimed."

      - name: the pytest entry point, and that it agrees with the script one
        # `bin/prime --pytest` is a second entry point to ONE suite, and an entry
        # point that is never exercised is an entry point that is quietly broken.
        # The cheap assertion is not "it exits 0" — it is that **both paths
        # report the same number of tests.**
        #
        # `bin/prime` prints `90/90 passed`; `bin/prime --pytest` prints
        # `90 passed`. If those numbers ever differ, one of the two collectors
        # has stopped finding something — a renamed test, a module that only the
        # script runner imports, a fixture pytest skips — and the divergence is
        # invisible in either log alone. Same venv, same interpreter, no second
        # install: this costs the suite's own runtime, which is well under a
        # second.
        #
        # A guard that cannot find its target is not a guard, so a pattern that
        # matches nothing is an error here rather than a pass.
        #
        # The `|| true` on both greps is load-bearing, not defensive noise. Under
        # `set -e` an assignment whose command substitution exits nonzero kills
        # the step outright, and `grep` exits 1 when it matches nothing — so
        # without it the emptiness check below is unreachable, and a renamed
        # summary line surfaces as a bare `exit 1` with no message, which is the
        # least diagnosable failure available. That shape was found by running
        # this step locally against a doctored log, not by reading it.
        shell: bash
        run: |
          set -euo pipefail
          bin/prime --pytest 2>&1 | tee "$RUNNER_TEMP/pytest.log"

          # `92/92 passed` -> `92`: cut on the space first, then on the slash, so
          # the trailing " passed" does not ride along into the comparison.
          script_count="$(
            grep -oE '^[0-9]+/[0-9]+ passed$' "$RUNNER_TEMP/prime.log" |
              tail -1 | cut -d' ' -f1 | cut -d/ -f2 || true
          )"
          pytest_count="$(
            grep -oE '^[0-9]+ passed' "$RUNNER_TEMP/pytest.log" |
              tail -1 | cut -d' ' -f1 || true
          )"

          if [ -z "$script_count" ] || [ -z "$pytest_count" ]; then
            echo "::error::could not read a test count out of one of the two runs." >&2
            echo "  bin/prime        -> $(tail -3 "$RUNNER_TEMP/prime.log")" >&2
            echo "  bin/prime --pytest -> $(tail -3 "$RUNNER_TEMP/pytest.log")" >&2
            exit 1
          fi
          if [ "$script_count" != "$pytest_count" ]; then
            echo "::error::the two entry points disagree: bin/prime collected" >&2
            echo "  $script_count, bin/prime --pytest collected $pytest_count. One of them" >&2
            echo "  is not running the suite it claims to run." >&2
            exit 1
          fi
          echo "::notice::both entry points ran $script_count tests."
