version: 1
name: gate-fixture

gate:
  command: [bin/gate]
  miseTask: prime
  entrypoint: bin/gate
  timeoutSeconds: 60
  proof:
    - id: suite
      match: '^([0-9]+)/[0-9]+ passed$'
      minimum: 3

external:
  selfContained: true
  requirements: []

ci:
  workflow: ci/ci.yml
  invokes: [bin/gate]
