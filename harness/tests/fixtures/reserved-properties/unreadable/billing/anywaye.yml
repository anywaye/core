# billing — a manifest this checker cannot read.
#
# THE BREAKAGE, AND IT IS NOT ABOUT TOMBSTONES. This manifest is well-formed
# enough that a reader skims it: it has a name, a language, a repository and an
# owner. It also has a key at the wrong indentation, which puts `x-anywaye-
# reserved-properties` inside `dependencies` rather than at the top level — so
# the tombstones are not declarations this checker can see, and a checker that
# treated "I saw no tombstones" as "there are none" would report this fleet
# clean.
#
# It is `reserved.declaration-unreadable`, a FAILURE, and exit 2 when the whole
# root is missing. The rule is the one this repository holds in four places
# (gateway's live-Redis tier, muse's MUSE_CORE_SCHEMAS, identity's
# TEST_DATABASE_URL, darkroom's --ignored): a check that could not happen read
# exactly like a check that passed, and every one of them was found by somebody
# relying on the green.
name: billing
description: Subscriptions, invoices and payments.
language: ruby
core: ~0.2.0

exposes:
  api: openapi/openapi.yaml
  events:
    - billing.invoice.created

consumes: []

dependencies:
  - name: identity
    version: ^0.1.0
  x-anywaye-reserved-properties:
    - name: invoice_id
      removedFrom: billing.invoice.created

repository:
  url: git@github.com:anywaye/billing.git
  defaultBranch: master
  visibility: private

owner:
  team: billing
  contact: billing@anywaye.com
