name: billing
description: Subscriptions, invoices and payments.
language: ruby
core: ~0.2.0

exposes:
  api: openapi/openapi.yaml
  events:
    - billing.invoice.created

consumes: []

dependencies: []

x-anywaye-reserved-properties:
  - name: invoice_id
    removedFrom: billing.invoice.paid
    note: >-
      A surface that does not exist. Nothing was removed from it, so this
      reserves nothing and blocks a future invoice_id forever.

repository:
  url: git@github.com:anywaye/billing.git
  defaultBranch: master
  visibility: private

owner:
  team: billing
  contact: billing@anywaye.com
