name: billing
description: Subscriptions, invoices and payments.
language: ruby
core: ~0.2.0

exposes:
  api: openapi/openapi.yaml
  events:
    - billing.invoice.created

consumes: []

dependencies: []

x-anywaye-reserved-properties:
  - name: invoice_id
    removedFrom: billing.invoice.created
    note: >-
      The invoice's machine id is the envelope's subject, so this payload carried
      it twice. Renaming it to invoice_number fixed the duplication; the NAME
      stays reserved so no later field can pick it up meaning something else.

repository:
  url: git@github.com:anywaye/billing.git
  defaultBranch: master
  visibility: private

owner:
  team: billing
  contact: billing@anywaye.com
