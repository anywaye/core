# The second conforming fixture, and the reason it exists.
#
# `fixtures/conforming/` is deliberately "the smallest document that satisfies
# every rule the harness can decide" — it declares one GET with a single 200 and
# no error path, no pagination and no mutating POST. That is the right fixture
# for the rules that existed when it was written, and it is the **wrong** fixture
# for the eight that decide the readable half of the HTTP contract: you cannot
# prove that `openapi.errors-are-problems` can fail in a document with no
# non-2xx response, and a self-test that tries is testing nothing.
#
# So this one carries, conforming, the three families docs/openapi-conventions.md
# names — problem+json on every non-2xx with the reserved codes and their
# statuses, the `{data, page{next_cursor, has_more}}` envelope behind a cursor,
# and a mutating POST that takes `Idempotency-Key` and declares its 409. Each of
# those is broken once, by name, in harness/tests/self_test.sh.
#
# Nothing here is decoration. Every `$ref` is deliberate, because a rule that
# only reads inline objects would have found nothing to say about a document
# written the way all seven documents in the anywaye workspace are written: the
# error responses live in `components/responses`, the problem schema lives in
# `components/schemas`, and the three request parameters are `$ref`s.
name: openapi-fixture
description: A fixture whose OpenAPI document exercises the readable half of core's HTTP conventions.
language: spec
core: ^0.2.0

exposes:
  api: openapi/v1.yaml

repository:
  url: git@github.com:anywaye/openapi-fixture.git
  defaultBranch: master
  visibility: public

owner:
  team: core
  contact: core@anywaye.com