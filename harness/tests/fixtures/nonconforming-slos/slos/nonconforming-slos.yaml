version: prometheus/v1
service: nonconforming-slos
slos:
  - tier: low
    name: nonconforming-slos-widget-availability
    objective: 100
    period: 28d
    description: A widget SLO written by a service that was in a hurry.
    windows:
      - window: 5m
        factor: 15
    labels:
      http_route: /v1/widgets
      tenant_id: ""
      node_memory_usage_bytes: ""
    sli:
      catalogEntry: http_server_availability
      events:
        total_query: sum(rate(http_server_request_duration_seconds_count_secrets{http_route="/v1/widgets",service_name="nonconforming-slos",tenant_id=""}[1h]))
        error_query: sum(rate(http_server_request_duration_seconds_count{http_route="/v1/widgets",node_memory_usage_bytes="",service_name="nonconforming-slos"}[1h]))
    alerting:
      name: NonconformingSlosWidgetAvailability
      annotations:
        summary: nonconforming-slos is failing widget requests
        runbook_url: ../docs/runbooks/nonconforming-slos/nonconforming-slos-widget-availability.md
      page_alert:
        disable: true
      ticket_alert:
        disable: false
  - tier: low
    name: nonconforming-slos-widget-availability
    objective: 99.5
    period: 28d
    description: The same SLO a second time, which Prometheus would silently drop.
    labels:
      http_route: /v1/widgets
    sli:
      catalogEntry: http_server_availability
      events:
        total_query: 'sum(rate(http_server_request_duration_seconds_count{http_route="/v1/widgets",service_name="nonconforming-slos"}[{{.window}}]))'
        error_query: 'sum(rate(http_server_request_duration_seconds_count{http_response_status_code_class="5xx",http_route="/v1/widgets",service_name="nonconforming-slos"}[{{.window}}]))'
    alerting:
      name: NonconformingSlosWidgetAvailability
      annotations:
        summary: nonconforming-slos is failing widget requests
        runbook_url: ../docs/runbooks/nonconforming-slos/nonconforming-slos-widget-availability.md
      page_alert:
        disable: true
      ticket_alert:
        disable: false