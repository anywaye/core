# The nonconforming-slos fixture's manifest: a service that is fine, whose SLOs
# are not. It carries no manifest faults of its own, so every finding a run
# produces comes from `slos/` and the exact-set assertion in
# test_the_harness_reports_every_slo_rule_one_file_breaks means what it says.
#
# It consumes `identity.user.created` so the catalog rule is exercised on the
# accepting side too, like every other fixture here.
name: nonconforming-slos
description: A fixture service whose SLO declarations break every SLO rule at once.
language: spec
core: ^0.2.0

exposes:
  api: openapi/v1.yaml

consumes:
  - identity.user.created

repository:
  url: git@github.com:anywaye/nonconforming-slos.git
  defaultBranch: master
  visibility: public

owner:
  team: core
  contact: core@anywaye.com