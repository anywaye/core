version: 1
service: nextjs-surface

surface:
  kind: http
  sources:
    - src/app/v1/[...path]/route.ts
    - src/app/healthz/route.ts
    - src/app/readyz/route.ts
  minimum: 6
  accountKey: account_id

entryPoints:
  - id: v1-read
    kind: http
    method: GET
    path: /v1/{path}
    accountScoped: true
    accountFrom:
      via: requireAccount
      file: src/middleware/requireAccount.ts
      line: 8
    registeredAt:
      file: src/app/v1/[...path]/route.ts
      line: 10

  - id: v1-write
    kind: http
    method: POST
    path: /v1/{path}
    accountScoped: true
    accountFrom:
      via: requireAccount
      file: src/middleware/requireAccount.ts
      line: 8
    registeredAt:
      file: src/app/v1/[...path]/route.ts
      line: 14

  - id: v1-patch
    kind: http
    method: PATCH
    path: /v1/{path}
    accountScoped: true
    accountFrom:
      via: requireAccount
      file: src/middleware/requireAccount.ts
      line: 8
    registeredAt:
      file: src/app/v1/[...path]/route.ts
      line: 18

  - id: v1-delete
    kind: http
    method: DELETE
    path: /v1/{path}
    accountScoped: true
    accountFrom:
      via: requireAccount
      file: src/middleware/requireAccount.ts
      line: 8
    registeredAt:
      file: src/app/v1/[...path]/route.ts
      line: 22

  - id: healthz
    kind: http
    method: GET
    path: /healthz
    accountScoped: false
    reason: public
    registeredAt:
      file: src/app/healthz/route.ts
      line: 3

  - id: readyz
    kind: http
    method: GET
    path: /readyz
    accountScoped: false
    reason: public
    registeredAt:
      file: src/app/readyz/route.ts
      line: 3
