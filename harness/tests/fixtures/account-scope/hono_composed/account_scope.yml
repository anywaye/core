version: 1
service: hono-composed

surface:
  kind: http
  sources:
    - src/index.ts
    - src/api.ts
  minimum: 2
  accountKey: account_id

entryPoints:
  - id: healthz
    kind: http
    method: GET
    path: /healthz
    accountScoped: false
    reason: public
    registeredAt:
      file: src/index.ts
      line: 22

  - id: me
    kind: http
    method: GET
    path: /me
    accountScoped: true
    accountFrom:
      via: requireJwt
      file: src/middleware/jwt.ts
      line: 24
    registeredAt:
      file: src/api.ts
      line: 12