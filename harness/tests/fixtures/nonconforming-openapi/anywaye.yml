# The manifest for the OpenAPI-nonconforming fixture. Schema-valid on purpose:
# the harness stops at the manifest schema, so these four OpenAPI rules are only
# reachable from a manifest that passes it.
name: harness-fixture
description: A fixture whose OpenAPI document breaks core's conventions.
language: spec
core: ^0.2.0

exposes:
  api: openapi/v1.yaml

repository:
  url: git@github.com:anywaye/harness-fixture.git
  defaultBranch: master
  visibility: public

owner:
  team: core
  contact: core@anywaye.com
