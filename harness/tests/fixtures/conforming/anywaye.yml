# The conforming fixture: a service that core's harness must accept.
#
# It is a fixture, not a real service, and the name says so — `harness-fixture`
# is a legal anywaye namespace name that no repository claims. It publishes no
# events, because the event catalog in docs/event-naming.md is a closed list and
# a fixture that invented a row would be editing the spec to make its own test
# pass. The event rules are exercised by breaking this file, one rule at a time,
# in harness/tests/self_test.sh.
#
# It consumes `identity.user.created`, which is a real catalogued type, so the
# catalog rule is exercised on the accepting side as well as the rejecting one.
name: harness-fixture
description: A fixture service, used by the contract-test harness's own tests.
language: spec
core: ^0.2.0

exposes:
  api: openapi/v1.yaml

consumes:
  - identity.user.created

repository:
  url: git@github.com:anywaye/harness-fixture.git
  defaultBranch: master
  visibility: public

owner:
  team: core
  contact: core@anywaye.com
