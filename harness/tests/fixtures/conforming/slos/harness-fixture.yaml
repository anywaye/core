version: prometheus/v1
service: harness-fixture
slos:
  - tier: low
    name: harness-fixture-widget-availability
    objective: 99.5
    period: 28d
    description: Widget requests are served without a server error.
    labels:
      http_route: /v1/widgets
    sli:
      catalogEntry: http_server_availability
      events:
        total_query: 'sum(rate(http_server_request_duration_seconds_count{http_route="/v1/widgets",service_name="harness-fixture"}[{{.window}}]))'
        error_query: 'sum(rate(http_server_request_duration_seconds_count{http_response_status_code_class="5xx",http_route="/v1/widgets",service_name="harness-fixture"}[{{.window}}]))'
    alerting:
      name: HarnessFixtureWidgetAvailability
      annotations:
        summary: harness-fixture is failing widget requests
        runbook_url: ../docs/runbooks/harness-fixture/harness-fixture-widget-availability.md
      page_alert:
        disable: true
      ticket_alert:
        disable: false