# The convention-nonconforming fixture: a manifest that satisfies core's schema
# and breaks every cross-field rule the harness can decide on its own.
#
# All five rules in one file, so the suite can assert the exact set of rule ids
# one run reports — which is the claim that matters. A harness that reports three
# of five and exits 0 has converted a known unknown into a green badge, and this
# fixture is what makes that visible.
#
# 1. `exposes.events` carries `courier.email.queued`, which is prefixed with
#    another service's name.  (docs/manifest-conventions.md rule 1)
# 2. `exposes.events` carries `harness-fixture.no_such_thing.happened`, which is
#    correctly prefixed with this service's own name and is in nobody's catalog
#    — so it trips the other half of the same fact. A published type nothing
#    subscribes to is a service announcing an event the platform is not waiting
#    for, and it is invisible until somebody generates a client.
# 3. That same type has no payload schema under schemas/events/, so its `data` is
#    whatever the publisher felt like that week.
# 4. `consumes` carries `identity.no_such_event.ever_happened`, which no
#    publisher in core's catalog declares.  (rule 6)
# 5. `exposes.api` points at a file that is not in this repository.
#
# The self-consume rule is *not* in this file, and the reason is worth reading:
# it needs a type that is both published and consumed, and the publisher-prefix
# rule rejects publishing anything not prefixed with this service's own name — so
# no single value can break both rules at once. harness/tests/self_test.sh breaks
# the *conforming* fixture to reach it, where the published type it consumes is
# already correctly prefixed.
name: harness-fixture
description: A fixture that satisfies the manifest schema and breaks the conventions.
language: spec
core: ^0.2.0

exposes:
  api: openapi/absent.yaml
  events:
    - courier.email.queued
    - harness-fixture.no_such_thing.happened

consumes:
  - identity.no_such_event.ever_happened

repository:
  url: git@github.com:anywaye/harness-fixture.git
  defaultBranch: master
  visibility: public

owner:
  team: core
  contact: core@anywaye.com
