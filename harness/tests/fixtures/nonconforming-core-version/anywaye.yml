# The version-conflicting fixture: byte-identical to `conforming/` except the
# one line below, so the ONLY thing this fixture can prove is that
# `core.constraint-unmet` is load-bearing. A nonconforming fixture that differs
# from the conforming one in six ways proves that *something* went red, and a
# breakage caught by the wrong check is not a proof of the right one.
#
# `^0.1.0` is not invented for this fixture. It is what `identity`, `courier`
# and `gateway` declare in their own `anywaye.yml` today, while compiling against
# core content that is 0.2.0 — the defect core-17 was sent to fix. A fixture
# copied out of the fleet is a fixture that cannot be quietly wrong about the
# fleet.
#
# THE VERSION IS NOT PINNED IN THIS FILE. A caret on a 0.x release pins the
# minor, so `^0.1.0` admits `[0.1.0, 0.2.0)` and nothing else. The moment core
# publishes 0.3.0 this line is satisfied again, and a fixture that went quietly
# green is a fixture nobody re-reads. So `harness/tests/core_version_test.sh`
# derives the conflicting constraint from the version core actually publishes —
# one minor *ahead* of it, which no version of core can satisfy — and proves the
# red there. The value below is the human-readable record of the real case.
name: harness-fixture
description: A fixture service, used by the contract-test harness's own tests.
language: spec
core: ^0.1.0

exposes:
  api: openapi/v1.yaml

consumes:
  - identity.user.created

repository:
  url: git@github.com:anywaye/harness-fixture.git
  defaultBranch: master
  visibility: public

owner:
  team: core
  contact: core@anywaye.com
