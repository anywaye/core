# tenancy.yml — what this service declares about its own account boundary, WHERE
# THE DATABASE HALF IS WRITTEN BY kit's substrate rather than by this service.
#
# This is the shape `identity-isolation-01` measured and could not declare. Its
# probe named the four policies `protect_table` really creates — one per command,
# named `<table>_anywaye_<command>` — and core's checker answered "the migrations
# do not create it — they write no policy at all", on a database
# `pg_class.relforcerowsecurity` and `internal/tenancy` both confirm is
# protected. Nothing here is a fudge to get a green: the declaration says exactly
# what the migrations do, which is make one call per table and let the template
# write the enable, the force and the four policies.
#
# `identity` is `anywaye.current_account_id()` and not the `app.current_account()`
# the hand-written fixture uses, because that is what the template scopes by. It
# is wrapped — `(select anywaye.current_account_id())` — which is why
# `tenancy.rls-per-row` passes here for the right reason rather than because the
# check was skipped.
#
# `roles` is the honest half. The template writes `to %I, %I` bound to
# `current_user` and `coalesce(p_login_role, current_user || '_app')`, so the
# two principals are named in the template and unnameable in the text; the roles
# below are what a migration run by `tenant_fixture` would bind, and the checker
# says so out loud in `harness/tenancy_findings.json` rather than comparing the
# declaration against a guess.
#
# Everything below the `rls` block is `fixtures/tenancy/conforming/tenancy.yml`
# unchanged: the repository half of this service is not what this fixture is
# about, and reusing it keeps the two fixtures comparable — a finding that moved
# between them moved because of the substrate and nothing else.
version: 1
service: tenant-fixture

# This service holds customer data and scopes every statement that reaches it.
accountScoped: true

scope:
  # The column this service scopes by. Declared, not guessed: the fleet has
  # three vocabularies already (D7) and a checker that picked one would be
  # guessing at the boundary rather than at the data.
  key: account_id
  # Exactly what the checker may read. A checker that read the whole repository
  # would have a different answer depending on whether node_modules is
  # installed, so it reads these three and nothing else.
  sources:
    - migrations
    - src
    - tests

# What the DATABASE does about it, as a separate claim from what the repository
# does — and here the claim is written the way a service that adopted kit's
# substrate writes it: the migrations hold NO `create policy` line and NO
# `alter table … row level security` line, because `protect_table` writes all of
# it. What the migrations hold is one call per table, and this block describes
# what that call did.
#
# `databaseEnforced: true` requires `identity` — the stable zero-argument
# function every policy reads — because a policy scoped by nothing is
# `tenancy.rls-permissive`, and "the thing the policies are scoped by" has to be
# a thing the file names rather than a thing a reader is left to infer. Here it is
# the substrate's own function, which is the only one the template can write.
rls:
  databaseEnforced: true
  identity: anywaye.current_account_id()
  # A separate list from `scope.sources`, and not an accident: this check reads
  # DDL and the one above reads statements, and one list naming both would end up
  # naming the whole repository.
  sources:
    - migrations
  tables:
    - table: assets
      # `const: true`, and the reason it is a const rather than a checked
      # boolean is in the schema: Postgres does not apply row-level security to
      # a table's OWNER unless the table is FORCED, this service owns the tables
      # it created, and omitting the bit leaves every policy on this table
      # unevaluated while the service keeps working.
      #
      # There is no `enable` or `force` line to point at here, so the const is
      # carried entirely by the declaration and the checker resolves it from the
      # `protect_table` call. That is the whole trade this fixture records: the
      # bit cannot be read off a line, so the template becomes the evidence, and a
      # service that calls the template and lies about the const is exactly as
      # detectable as before — the four policy names resolve or they do not.
      forced: true
      policies:
        # All four, because `protect_table` writes one per command and `for all`
        # is the shape it refuses to write. A declaration naming three of them
        # gets `tenancy.rls-undeclared` on the fourth: an undeclared policy is a
        # boundary nobody is accountable for, and permissive policies are OR-ed
        # together, so the one nobody declared can widen the three that were.
        - name: assets_anywaye_select
          command: select
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0002_substrate.sql
            line: 400
        - name: assets_anywaye_insert
          # `for insert` is legal here and is deliberately absent from
          # `entryPoints[].operation`. An entry point reaches an account's
          # EXISTING row; an insert creates one. `with check` is what stops a
          # caller stamping somebody else's account onto a new row, and it is a
          # different question about the same boundary.
          command: insert
          clause: with check
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0002_substrate.sql
            line: 400
        - name: assets_anywaye_update
          command: update
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0002_substrate.sql
            line: 400
        - name: assets_anywaye_delete
          command: delete
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0002_substrate.sql
            line: 400
    - table: asset_variants
      forced: true
      policies:
        # The table protected by the SECOND call, the one passing its login role
        # explicitly. Two tables on two calls rather than one, because a scanner
        # that learned the shape from a single call has proved it can recognise a
        # call; two is what proves it resolves a table rather than a file.
        - name: asset_variants_anywaye_select
          command: select
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0002_substrate.sql
            line: 406
        - name: asset_variants_anywaye_insert
          command: insert
          clause: with check
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0002_substrate.sql
            line: 406
        - name: asset_variants_anywaye_update
          command: update
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0002_substrate.sql
            line: 406
        - name: asset_variants_anywaye_delete
          command: delete
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0002_substrate.sql
            line: 406

# The declared enumeration. Declared, NEVER INFERRED — see docs/tenancy.md for
# the measurement that decided it.
entryPoints:
  # fetch by id. The statement that a dropped `and account_id = $2` turns into
  # an IDOR, and the one darkroom gets right with no test at all.
  - id: asset-fetch
    operation: select
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 22
    negative:
      asserts: absent
      cases:
        # Three, in this order, and the third is the one with the information in
        # it. See docs/tenancy.md under the three-way heading.
        - id: no-identity
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 39

        - id: other-account
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 44

        - id: own-account
          asserts: present
          # A column the assertion reads off the row that came back. Not `nil`,
          # which is the language's spelling of nothing and would satisfy the
          # third arm without the account ever seeing its own row.
          expects: checksum
          file: tests/tenancy_test.rb
          line: 49


  # the account's own list
  - id: asset-list
    operation: select
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 25
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: empty
          file: tests/tenancy_test.rb
          line: 54

        - id: other-account
          asserts: absent
          expects: empty
          file: tests/tenancy_test.rb
          line: 58

        - id: own-account
          asserts: present
          expects: checksum
          file: tests/tenancy_test.rb
          line: 62


  # the settlement window
  - id: asset-pending
    operation: select
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 28
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: empty
          file: tests/tenancy_test.rb
          line: 67

        - id: other-account
          asserts: absent
          expects: empty
          file: tests/tenancy_test.rb
          line: 71

        - id: own-account
          asserts: present
          expects: status
          file: tests/tenancy_test.rb
          line: 75


  # the write
  - id: asset-settle
    operation: update
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 31
    negative:
      asserts: absent
      cases:
        # A write's "nothing" is the other account's row coming back unchanged.
        # An empty list would be a lie about a row that exists, which is why
        # `expects` has two spellings in this format and not one.
        - id: no-identity
          asserts: absent
          expects: assert_unchanged
          file: tests/tenancy_test.rb
          line: 80

        - id: other-account
          asserts: absent
          expects: assert_unchanged
          file: tests/tenancy_test.rb
          line: 84

        - id: own-account
          asserts: present
          expects: assert_changed
          file: tests/tenancy_test.rb
          line: 88


  # the delete, which is the one that would end a customer's data
  - id: asset-delete
    operation: delete
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 34
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: assert_unchanged
          file: tests/tenancy_test.rb
          line: 93

        - id: other-account
          asserts: absent
          expects: assert_unchanged
          file: tests/tenancy_test.rb
          line: 97

        - id: own-account
          asserts: present
          expects: assert_deleted
          file: tests/tenancy_test.rb
          line: 101


  # a second table, fetched by id. Declared separately from `asset-fetch` on
  # purpose: the closure key is the file, the operation and the subject, so two
  # tables that are both reached by id are two things that can each lose the
  # scope without the other one hiding it.
  - id: asset-variant-fetch
    operation: select
    subject: asset_variants
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 37
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 106

        - id: other-account
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 110

        - id: own-account
          asserts: present
          expects: id
          file: tests/tenancy_test.rb
          line: 114


  # the repository method, where the account is a BIND rather than a literal.
  # Named with `binds` because a predicate check cannot see this defect: a
  # query that still says `account_id = $2` while nothing passes $2 any more is
  # scoped on paper and unscoped in fact.
  - id: asset-checksum-bind
    operation: select
    subject: assets
    enforced:
      mechanism: bind-parameter
      binds: account_id
      file: src/assets.rb
      line: 11
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 119

        - id: other-account
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 123

        - id: own-account
          asserts: present
          expects: id
          file: tests/tenancy_test.rb
          line: 127
