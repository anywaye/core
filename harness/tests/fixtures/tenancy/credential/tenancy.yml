# tenancy.yml — what a service that calls kit's `protect_credential_table`
# declares about its own account boundary. TWO tables protected the ordinary way
# and ONE protected the other way, and the third is why this fixture exists.
#
# `identity-isolation-04` amended its `00016` to
# `select anywaye.protect_credential_table('api_keys', 'token_digest')` and got
# SEVEN `tenancy.rls-*` failures against a table whose `relforcerowsecurity` is
# true and whose five policies are in `pg_policy`. Six were core's recogniser
# and one — the resolve policy — was core's recogniser twice, because
# `<table>_anywaye_<command>` does not describe
# `<table>_anywaye_resolve`: that one is scoped by the digest the CALLER
# PRESENTED and not by the account at all.
#
# So this file is the shape that pilot could not write. It says five policies for
# `api_keys`, four for each of the other two, and `identity:
# anywaye.current_account_id()` for all three — because that is the function the
# template scopes by, and for four of the five policies on `api_keys` it is the
# only one. The fifth's predicate is
# `token_digest = (select anywaye.current_credential_digest())`, which is not
# `rls.identity` and is NOT SUPPOSED to be: it is a narrower scope, not a
# missing one, and a checker that demanded the account identity of it would be
# demanding a widening.
#
# Everything below `entryPoints` is `fixtures/tenancy/conforming/tenancy.yml`
# unchanged, and so is this fixture's `0001_assets.sql`, `src/` and `tests/`:
# the repository half is not what this fixture is about, and reusing it keeps the
# three fixtures comparable — a finding that moved between them moved because of
# the call and nothing else.
version: 1
service: tenant-fixture

# This service holds customer data and scopes every statement that reaches it.
accountScoped: true

scope:
  # The column this service scopes by. Declared, not guessed: the fleet has
  # three vocabularies already (D7) and a checker that picked one would be
  # guessing at the boundary rather than at the data.
  key: account_id
  # Exactly what the checker may read. A checker that read the whole repository
  # would have a different answer depending on whether node_modules is
  # installed, so it reads these three and nothing else.
  sources:
    - migrations
    - src
    - tests

# What the DATABASE does about it. The migrations hold NO `create policy` line
# and NO `alter table … row level security` line, because the template writes all
# of it through `execute format(...)`. What they hold is one call per table, and
# this block describes what each call did.
rls:
  databaseEnforced: true
  # The template's own function, because that is the only function it can scope
  # by. A declaration naming anything else gets `tenancy.rls-permissive` with the
  # substrate's reason in the message, rather than a sentence claiming a policy is
  # scoped by nothing the checker can see.
  identity: anywaye.current_account_id()
  sources:
    - migrations
  tables:
    - table: assets
      # `const: true` in the schema, and here it is carried entirely by the
      # declaration: there is no `force` line on any file to point at, because the
      # template writes that too. The bit cannot be read off a line, so the CALL is
      # the evidence — and a service that calls the template and lies about the
      # const is exactly as detectable as before, because the policy names resolve
      # or they do not.
      forced: true
      policies:
        # All four, because `protect_table` writes one per command and refuses to
        # write `for all`. Naming three gets `tenancy.rls-undeclared` on the
        # fourth: an undeclared policy is a boundary nobody is accountable for,
        # and permissive policies are OR-ed together, so the one nobody declared
        # can widen the three that were.
        - name: assets_anywaye_select
          command: select
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 722
        - name: assets_anywaye_insert
          command: insert
          clause: with check
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 722
        - name: assets_anywaye_update
          command: update
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 722
        - name: assets_anywaye_delete
          command: delete
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 722
    - table: asset_variants
      forced: true
      policies:
        - name: asset_variants_anywaye_select
          command: select
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 728
        - name: asset_variants_anywaye_insert
          command: insert
          clause: with check
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 728
        - name: asset_variants_anywaye_update
          command: update
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 728
        - name: asset_variants_anywaye_delete
          command: delete
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 728
    # FIVE, AND THE FIFTH IS NOT AN ACCOUNT POLICY. The first four are the same
    # four the other two tables have, because `protect_credential_table` CALLS
    # `protect_table` rather than repeating it — a fix to one is a fix to both and
    # there is no second copy of ENABLE/FORCE to drift. The fifth exists because
    # an authentication request has no account to act as: it has a credential it
    # is trying to resolve, and a table scoped only by `account_id` refuses it
    # before anybody gets to check whether the key is valid.
    - table: api_keys
      forced: true
      policies:
        - name: api_keys_anywaye_select
          command: select
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 742
        - name: api_keys_anywaye_insert
          command: insert
          clause: with check
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 742
        - name: api_keys_anywaye_update
          command: update
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 742
        - name: api_keys_anywaye_delete
          command: delete
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 742
        # The resolve policy. `for select` and nothing else, which is what makes it
        # safe: RLS policies are OR-ed together, so a policy that said merely "a
        # credential session may select this table" would hand the caller a
        # table-wide SELECT and let it browse every key in the database with the
        # one query this mechanism exists to prevent. `clause: using` because
        # `for select` filters rows rather than raising, and this row deliberately
        # does NOT pretend to be scoped by `rls.identity` — see the header.
        - name: api_keys_anywaye_resolve
          command: select
          clause: using
          roles: [tenant_fixture, tenant_fixture_app]
          constrained:
            file: migrations/0003_credential.sql
            line: 742

entryPoints:
  # fetch by id. The statement that a dropped `and account_id = $2` turns into
  # an IDOR, and the one darkroom gets right with no test at all.
  - id: asset-fetch
    operation: select
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 22
    negative:
      asserts: absent
      cases:
        # Three, in this order, and the third is the one with the information in
        # it. See docs/tenancy.md under the three-way heading.
        - id: no-identity
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 39

        - id: other-account
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 44

        - id: own-account
          asserts: present
          # A column the assertion reads off the row that came back. Not `nil`,
          # which is the language's spelling of nothing and would satisfy the
          # third arm without the account ever seeing its own row.
          expects: checksum
          file: tests/tenancy_test.rb
          line: 49


  # the account's own list
  - id: asset-list
    operation: select
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 25
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: empty
          file: tests/tenancy_test.rb
          line: 54

        - id: other-account
          asserts: absent
          expects: empty
          file: tests/tenancy_test.rb
          line: 58

        - id: own-account
          asserts: present
          expects: checksum
          file: tests/tenancy_test.rb
          line: 62


  # the settlement window
  - id: asset-pending
    operation: select
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 28
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: empty
          file: tests/tenancy_test.rb
          line: 67

        - id: other-account
          asserts: absent
          expects: empty
          file: tests/tenancy_test.rb
          line: 71

        - id: own-account
          asserts: present
          expects: status
          file: tests/tenancy_test.rb
          line: 75


  # the write
  - id: asset-settle
    operation: update
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 31
    negative:
      asserts: absent
      cases:
        # A write's "nothing" is the other account's row coming back unchanged.
        # An empty list would be a lie about a row that exists, which is why
        # `expects` has two spellings in this format and not one.
        - id: no-identity
          asserts: absent
          expects: assert_unchanged
          file: tests/tenancy_test.rb
          line: 80

        - id: other-account
          asserts: absent
          expects: assert_unchanged
          file: tests/tenancy_test.rb
          line: 84

        - id: own-account
          asserts: present
          expects: assert_changed
          file: tests/tenancy_test.rb
          line: 88


  # the delete, which is the one that would end a customer's data
  - id: asset-delete
    operation: delete
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 34
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: assert_unchanged
          file: tests/tenancy_test.rb
          line: 93

        - id: other-account
          asserts: absent
          expects: assert_unchanged
          file: tests/tenancy_test.rb
          line: 97

        - id: own-account
          asserts: present
          expects: assert_deleted
          file: tests/tenancy_test.rb
          line: 101


  # a second table, fetched by id. Declared separately from `asset-fetch` on
  # purpose: the closure key is the file, the operation and the subject, so two
  # tables that are both reached by id are two things that can each lose the
  # scope without the other one hiding it.
  - id: asset-variant-fetch
    operation: select
    subject: asset_variants
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 37
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 106

        - id: other-account
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 110

        - id: own-account
          asserts: present
          expects: id
          file: tests/tenancy_test.rb
          line: 114


  # the repository method, where the account is a BIND rather than a literal.
  # Named with `binds` because a predicate check cannot see this defect: a
  # query that still says `account_id = $2` while nothing passes $2 any more is
  # scoped on paper and unscoped in fact.
  - id: asset-checksum-bind
    operation: select
    subject: assets
    enforced:
      mechanism: bind-parameter
      binds: account_id
      file: src/assets.rb
      line: 11
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 119

        - id: other-account
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 123

        - id: own-account
          asserts: present
          expects: id
          file: tests/tenancy_test.rb
          line: 127
