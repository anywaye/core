name: core
description: The anywaye manifest format, event envelope and contract conventions every service compiles against.
language: spec
core: ^0.2.0

env:
  - name: DATABASE_URL
    required: false
    secret: true
    description: "Postgres DSN (examples)."
  - name: TEST_DATABASE_URL
    required: false
    secret: true
    description: "Test DSN."

repository:
  url: git@github.com:anywaye/core.git
  defaultBranch: master
  visibility: private

owner:
  team: core
  contact: core@anywaye.com
