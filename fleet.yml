# fleet.yml — what the cafaye fleet publishes, read from the services' own manifests.
#
# Validated by tests/test_specs.py against schemas/fleet.schema.json. The schema
# is core's; this file is the transcription, and the `sourceCommit` on every
# service is what makes it checkable rather than a claim.
#
# WHY THIS FILE EXISTS. Core's catalog used to be checked only against core's own
# examples/valid/*.cafaye.yml — files core also writes, so the assertion could
# only ever catch core disagreeing with itself. A real service could advertise
# any event type at all and no suite in the system would notice. courier did:
# five types in the two-segment form that core v0.2 froze away reached master,
# and nothing noticed until this file did. They have since been corrected in
# courier's own manifest and in `Courier.Events.types/0`, so `manifestViolations`
# below is empty and the story is now the reason the field exists rather than a
# list of live damage. This file is the other side of that comparison: a
# machine-readable record of what the real services declare, so a publisher
# cannot advertise an event the catalog has never heard of.
#
# Four lists per service, and the difference between them is the point:
#
#   events            what the manifest declares today, in the conforming
#                     three-segment form, AND for which core has finished its
#                     side. Every entry has a catalog row and a payload schema in
#                     core; both directions are asserted.
#   cataloguedOnly    a catalog row nobody publishes yet. A catalog entry is a
#                     promise and a manifest entry is a claim. Collapsing the
#                     two would either make the catalog empty of promises or
#                     make every promise a lie.
#   pendingCoreContract the mirror image of `cataloguedOnly`, and the reason the
#                     word "mirror" is the right one: a type the manifest DOES
#                     declare and the service DOES publish, where core has not
#                     yet shipped the catalog row and the payload schema that
#                     make it usable. The debt is core's and the list says so
#                     rather than leaving a type to be discovered missing; see
#                     D34 in DECISIONS.md for the argument. A type in this list
#                     must be one core really has not finished, and that is
#                     asserted: an entry with a row and a schema is an excuse,
#                     not a debt. NO SERVICE IS IN THIS LIST TODAY — core-23
#                     emptied it — and the property stays, because a list that
#                     appears when it is needed is better than a list that is
#                     deleted when it is not.
#   manifestViolations types the manifest spells in a way that violates the
#                     grammar, transcribed verbatim. Never catalogued: core does
#                     not name a non-conforming type to make it valid, the fix
#                     belongs to the publisher. Delete the entry when the
#                     service's manifest is corrected.
#
# A service declaring a type is not a service publishing one, and this file keeps
# the two apart in prose rather than in a list, because the difference is
# per-builder and per-caller rather than per-type: courier declares five and
# emits three, and which three is a fact about courier's code and not something
# a schema can derive. The notes say so per service.
#
# HOW TO REFRESH. Re-read each `cafaye.yml` at the commit named below, move the
# service's entry — `api` for a document the manifest declares, one of the four
# lists per type, and a `sourceCommit` naming the commit you read. Bump `readOn`.
# The assertions in tests/test_specs.py then tell you what else that service owes
# core — a catalog row, a payload schema, or the deletion of a debt the service
# has already paid — which is exactly what `caf contract lint` should do
# automatically once it exists.
#
# WHAT WAS STALE, as of 2026-10-01, and what was still owed after the re-read.
# Every service's `cafaye.yml` had moved since the `sourceCommit` this file
# carried, so all five were re-read and every `sourceCommit` below now names the
# commit the entry was actually transcribed at. Re-reading found four false
# statements, all corrected in place: courier's `manifestViolations` (the manifest
# no longer violates the grammar), courier's `core: ^0.1.0` note (it is
# `^0.2.0`), the absence of any `api` field (four services name an OpenAPI
# document and the file had nowhere to say so, so courier's entry denied one in
# prose), and courier's published-type count. One thing was still owed by core
# itself at the end of that re-read, and it is the paragraph below.
#
# The debt core recorded against itself is PAID, and the list is kept empty on
# purpose. core-22 wrote `pendingCoreContract` with eight entries — identity's
# declared types for which core had shipped neither half of the contract, and two
# of them (`identity.oidc_client.created`, `identity.oidc_client.revoked`) had no
# catalog row at all. core-23 paid all eight: a catalog row and a payload schema
# each, the schemas read out of the emitting sites in identity's own
# `internal/outbox/` package rather than written from the type's name, and every
# type moved to `events` in the same commit. **The list is now empty and is left
# that way.** It is not deleted, and that is a decision with teeth rather than
# tidiness: the schema property, the header above and the three assertions over
# it all stay, so the next type a service declares and core has not answered
# goes on a list whose entire meaning is "core has not finished this" — a list
# that can be checked in both directions, and
# `test_a_pending_core_contract_type_is_a_debt_core_really_owes` is what refuses
# an excuse. The alternative, deleting the property with the entries, would have
# made the next debtor invent a fourth place to record the same fact, which is
# how the four lists became four in the first place. See D34 in DECISIONS.md for
# the argument and for what the list is worth.
#
# EVERY PUBLISHED TYPE NOW HAS BOTH HALVES, across all five services — 23 types,
# every one with a row here and a schema under `schemas/events/`. That is the
# first time the fleet has been in that state and it is asserted rather than
# hoped for: `test_every_published_fleet_event_has_a_catalog_row_and_a_payload_schema`
# is the assertion, and it is the one that would have caught courier's five
# two-segment types the day they were declared.
#
# WHAT THIS FILE STILL CANNOT CHECK, because it is the honest limit rather than an
# oversight: it cannot read a sibling repository. Every list above is a
# transcription, and `sourceCommit` is what makes one re-readable. The
# assertions in tests/test_specs.py check the record against core — that a
# published type has a row and a schema, that a catalog row is accounted for, that
# a note does not contradict a field beside it — and none of them can catch a
# service that changed its manifest after the read, or a payload schema that has
# drifted from the code that fills it. That half is the next reader's, and
# `caf contract lint` when it exists. **core-23 read identity's source to write
# eight schemas and could not read it again on every commit**: a payload schema is
# a promise to every consumer on the bus, and nothing in core notices the day a
# publisher adds a field to one. That is the argument for `caf contract test`,
# not for a looser schema.
#
# TELEMETRY, per service. Observability is on by default and worked on in dev
# (PLAN.md §7b), so "what is instrumented" deserves one answer rather than six.
# `endpointVariable` is derived from the service name and is the ONLY contract:
# a self-hoster who already runs Datadog, Honeycomb or Grafana Cloud points it
# there, and unsetting it is a tested no-op rather than a code change. `signals`
# is what a service exports today, not what it could — the same honesty as
# `events` versus `cataloguedOnly`, and asserted the same way. Checked by
# tests/test_specs.py against docs/observability.md and the *_OTEL_ENDPOINT
# contract in schemas/telemetry/otel-endpoint.schema.json.
#
# THREE STATES, and `signals` is only the middle one. This file was wrong about
# all three at once, so they are named here rather than left to a reader:
#
#   spec'd        core owns the contract and a rule exists. Every service below
#                 has this, whether or not it emits anything.
#   instrumented  the service wires an OTel SDK and exports from its own code,
#                 to whatever endpoint `endpointVariable` names. THIS is what
#                 `signals` records.
#   deployed      something is running to receive it. No entry in this file
#                 claims it, because it is not core's to claim: core does not
#                 run a collector and this repository does not deploy one.
#
# The error this paragraph exists to prevent: reading `signals: []` as "not
# instrumented". A service with an empty list emits nothing of its own; a
# service with `traces` may have nothing to send them to. Those are different
# sentences and the first is not a weaker version of the second. It was read
# the wrong way for a day — every service below reads `signals: []` at the
# `readOn` date below — and the error reached the documentation as "cafaye has
# no observability", which is a fleet-wide sentence that no entry in this file
# was entitled to make. `test_a_service_recorded_as_exporting_nothing_asserts_no_fleet_wide_state`
# is what keeps it from coming back.
#
# PROVENANCE, and it is two dates because they are two transcriptions.
# `readOn` and `sourceCommit` date the `events` list. `signals` was re-read on
# 2026-10-01, at the commit each service's `telemetry.notes` names, and the
# three SDKs landed that day — after the manifests were read, which is the whole
# reason the lists disagreed. A service can gain telemetry without its manifest
# changing, so the two dates are not the same fact and are not merged.
#
# NOT HERE: which repositories exist. That is `caf`'s business. This file is
# the list of events the ones that do exist declare.

# The core spec this declaration was transcribed against.
spec: "0.2"

# The day the manifests below were read off each repository's primary branch.
readOn: "2026-10-07"

services:
  - name: identity
    repository: git@github.com:cafaye/identity.git
    manifest: cafaye.yml
    branch: master
    sourceCommit: 608fa9afa5cb1704c3c85bde2e1c81aab9f1dbf2
    # `exposes.api`, transcribed. Read at the commit above; the pointer has been
    # in the manifest since 52bc470, so this entry is a year late recording a
    # field that was never in doubt.
    api: openapi/v1.yaml
    events:
      - identity.api_key.created
      - identity.api_key.revoked
      - identity.mfa.disabled
      - identity.mfa.enabled
      - identity.oidc_client.created
      - identity.oidc_client.revoked
      - identity.session.revoked
      - identity.user.created
      - identity.user.email_verified
    cataloguedOnly:
      - identity.account.created
      - identity.member.invited
      - identity.member.joined
      - identity.member.removed
      - identity.member.role_changed
    notes: >-
      The manifest declares NINE types and this entry now records all nine as
      published, which is the first time it has been true: it previously recorded
      one as published and eleven as catalogued-only, and eight of those eleven
      were both published by identity and marked as promises nobody had made
      good. core-23 paid that debt — eight payload schemas read out of identity's
      own event builders in `internal/outbox/`, plus the two catalog rows the
      `identity.oidc_client.*` types never had, which is why
      `test_every_published_fleet_event_has_a_catalog_row_and_a_payload_schema`
      can now assert what it was written to assert across the whole fleet. The
      `pendingCoreContract` key is DELETED rather than left as an empty list,
      because a list nobody is in is not a fact about the fleet; the schema
      property, the file header and the three assertions stay, for the next
      debtor, and D34 is the argument for the list rather than for deleting it.
      The five in `cataloguedOnly` are the mirror and are untouched: catalogued
      in core, declared nowhere in identity, and five more that identity's code
      emits (`identity.account.created`, `identity.member.invited`,
      `identity.member.accepted`, `identity.member.removed`,
      `identity.member.role_changed`) are undeclared in the manifest so that
      `caf contract lint` stays quiet until core has rows for them. `member.accepted`
      has no catalog row at all under that name; core calls the fact
      `identity.member.joined`, and the divergence is recorded rather than
      resolved (see D9 in courier's DECISIONS.md and this file's event-naming doc).
      The `sourceCommit` below MOVED to e31d030 on 2026-10-07 (packet
      identity-w25-payloads), and the move is the point rather than an
      oversight: identity's builders were re-read at that commit, the nine
      types are unchanged, and eight of the nine schemas still describe
      their builders. The ninth, `identity.session.revoked`, had gained an
      `email` field — both notices it triggers are mailed and the fleet's
      consumer is cross-service, so the address travels in the payload
      (REPORT-courier-consumer-invite-01 §2.6) — and its payload schema
      was extended to match, the first edit to a core-23 schema.
    telemetry:
      endpointVariable: IDENTITY_OTEL_ENDPOINT
      signals: [traces]
      probes: true
      notes: >-
        Serves HTTP, so it owes the healthz/readyz split in
        schemas/telemetry/probes.schema.json. Traces only, and read at
        4e6f577 on 2026-10-01: the SDK landed in afb457d, which builds a
        batched tracer over an OTLP/HTTP exporter
        (internal/telemetry/telemetry.go, sdktrace.NewTracerProvider with
        sdktrace.WithBatcher) and collapses an error class outside core's
        thirteen to _OTHER. No meter is installed, so metrics are not exported
        from this service. IDENTITY_OTEL_ENDPOINT wins, with
        OTEL_EXPORTER_OTLP_ENDPOINT honoured as the fallback.

  - name: billing
    repository: git@github.com:cafaye/billing.git
    manifest: cafaye.yml
    branch: master
    sourceCommit: 7133643d8eebb4dd5de2d8df34c7ba20fda89f79
    # `exposes.api`, transcribed. Read at the commit above; the pointer has been
    # in the manifest since 3155140, the packet that built the billing domain.
    api: openapi/v1.yaml
    events:
      - billing.customer.created
      - billing.payment.failed
      - billing.payment.succeeded
      - billing.plan.created
      - billing.plan.updated
      - billing.subscription.canceled
      - billing.subscription.started
      - billing.subscription.updated
    cataloguedOnly:
      - billing.subscription.past_due
      - billing.payment.refunded
      - billing.invoice.created
      - billing.usage.recorded
    notes: >-
      Three types come from model callbacks and five from the Stripe webhook
      mapping, and the manifest deliberately names no catalogued type this build
      never publishes. billing.plan.updated is the one type that reached master
      with no core catalog row at all; core now has one, landed with the payload
      schemas and a catalog assertion that would have caught it.
      FINDING, core-26, and it is a disagreement in BOTH directions:
      Subscriptions::Lifecycle#core_payload/1
      (app/services/subscriptions/lifecycle.rb:353) writes `plan_id` and
      `account_id` as bare uuids onto all three subscription payloads, which
      core's three schemas do not name, and core's schemas require `processor`,
      `processor_event_id`, `kind` and `customer_id`, which billing never
      sends. billing grew `subscriptions`
      (db/migrate/20260930000007_create_subscriptions.rb) after D10 was written
      and knows both halves — PENDING_PAYLOAD_ALIGNMENT in
      test/contract/outbox_envelope_contract_test.rb:66-88 is asserted in both
      directions. A real `billing.subscription.started` does not validate against
      core's schema for it. D39; core's own claims were corrected in core-26 and
      the schemas are not, which is a manager's call.
      RE-READ 2026-10-02 at the same commit, still billing's HEAD, for the
      RESOURCE: `Kit::Telemetry.resource/1` (lib/kit/telemetry.rb:180-201) sets
      `telemetry.sdk.name` and `.language` BY HAND, so billing is a second
      publisher of the attributes D40 adds. Its own comment says `.create`
      merges the SDK's default resource and so reports a `process.pid`; on the
      installed SDK (1.13.1, measured) it does not merge and there is no
      `process.pid`, so that stays off core's allowlist and billing owes the
      comment a correction.
      RE-READ 2026-10-07 at 7133643 (billing's W43 merge, the commit this entry's
      `sourceCommit` now records), for the RECIPIENT FACT: billing's money events
      gained `email` and the three subscription events gained `plan_name`, and
      the five payload schemas were extended to declare them — `email` optional
      and never null (the producer merges it only when the customer has an
      address), `plan_name` required and non-empty (written unconditionally from
      the plan row the builder has already resolved). The three catalogue
      schemas (customer/created, plan/created, plan/updated) were re-read at the
      same commit and confirmed unchanged: their `as_json` producers are
      byte-identical between 7251993 and 7133643, verified by diff. The id
      shapes above are unchanged. What D39 records is untouched: the three
      subscription schemas still do not declare `account_id`, `currency`,
      `plan_id`, `started_at` or `processor_subscription_id`, and a real
      subscription event still does not validate against them — that decision is
      still the manager's, and this packet does not make it.
    telemetry:
      endpointVariable: BILLING_OTEL_ENDPOINT
      signals: [traces]
      probes: true
      notes: >-
        Traces only, read at 7251993 on 2026-10-01; the SDK landed in a42a5f8,
        which installs a tracer provider with a simple span processor over the
        OTLP exporter (lib/kit/tracer_installer.rb) and an outermost request
        middleware that opens the span
        (lib/middleware/request_telemetry.rb). No meter, so no metrics from this
        service. FINDING, not a correction: its error.type vocabulary is three
        values of its own (lib/kit/telemetry.rb) and none is in core's
        thirteen, so a billing error span would fail
        schemas/telemetry/traces.schema.json. billing owns that fix.

  - name: courier
    repository: git@github.com:cafaye/courier.git
    manifest: cafaye.yml
    branch: master
    sourceCommit: a8f15ccef11bd6148c71fbe38327d9fbebbfe2e2
    # `exposes.api`, transcribed. Read at the commit above: `info.version` is
    # 2.2.0, and the document covers every route the router serves except
    # /healthz and /readyz, which its own header names and
    # `test/courier_web/openapi_document_test.exs` enforces in both directions.
    # The pointer has been in the manifest since 7b99879 (courier-03) and the
    # document became complete in courier-05 — this entry used to deny both in
    # prose, and a sentence in a field nobody validated outlived two packets
    # that added operations to a document it said did not exist.
    api: openapi.yaml
    # The manifest's own spellings, and they are the conforming ones: courier's
    # five two-segment types were corrected here in the same commit that
    # corrected `Courier.Events.types/0`, so the `manifestViolations` list this
    # entry used to carry is deleted rather than shortened. Deleting the entry
    # IS the acknowledgement docs/event-naming.md asks for.
    events:
      - courier.email.bounced
      - courier.email.complained
      - courier.email.delivered
      - courier.email.queued
      - courier.notification.suppressed
    notes: >-
      Declares all five; publishes four. `courier.email.delivered` is written to
      `outbox_events` by `Courier.Deliver` in the transaction that sent the mail
      (lib/courier/deliver.ex). `courier.email.bounced` and
      `courier.email.complained` are written by `Courier.InboundReports` in the
      SAME transaction as the suppression row they belong to, chosen by that
      row's state — `:undeliverable` for a bounce, `:suppressed` for a complaint
      (lib/courier/inbound_reports.ex, `attrs/1`), so there is no suppression
      without the announcement. Those two had builders and no caller until
      courier-22c wired `POST /inbound/resend`.
      `courier.notification.suppressed` had a builder and NO caller until the
      one-click unsubscribe endpoint gave it one:
      `Courier.Unsubscribes.publish/1` (lib/courier/unsubscribes.ex:479-495)
      writes the row in the same transaction as the `notification_preferences`
      row that turned the type off, with `reason: preference_off`, the subject
      set to the user and no `message_id` — which is core's D8 and exactly what
      `schemas/events/courier/notification/suppressed.schema.json` requires. It
      is still not called for a *refused* send: `Courier.Deliver`'s moduledoc
      still promises "no mail, no event" for `{:error, :suppressed}` and
      `{:error, {:suppressed_address, _}}`, and courier says in its own source
      that it did not change that sentence. So the count is four of five.
      The one still declared-and-unimplemented is `courier.email.queued`: no
      builder, because the send path is synchronous and has no backlog to
      measure. core-26 re-read courier to check whether that builder existed under
      another name and recorded the answer — see the three files below.
      **This entry's `sourceCommit` has NOT been moved, and the note above reads
      courier's master at `ae8a660`, which is past it.** core-26 read
      `lib/courier/events.ex`, `lib/courier/unsubscribes.ex` and
      `lib/courier/deliver.ex` and the three payloads the live builders emit are
      unchanged in shape (`deliver.ex`'s `data/4` at HEAD is the same four
      fields; `inbound_reports.ex` is byte-identical between the two commits).
      It did not re-read courier's OpenAPI document, its telemetry configuration
      or the rest of its surface, so claiming the whole registry was read at
      `ae8a660` would be claiming a re-read nobody did. The pin and the prose are
      therefore honest about being out of step, which is the state D36's remedy
      exists for and the next courier packet should close.
      The `core:` constraint this entry used to call stale is not stale: courier
      declares `core: ^0.2.0` and mix.exs pins no cafaye dependency, so the
      manifest line is the only one there is.
    telemetry:
      endpointVariable: COURIER_OTEL_ENDPOINT
      signals: [traces]
      probes: true
      notes: >-
        Serves HTTP and runs both probes, and names an OpenAPI document above.
        Traces only, and read at 73c9034 on 2026-10-01: the SDK landed in
        d806bad, which configures a batch processor over
        :opentelemetry_exporter (lib/courier/telemetry.ex, sdk_config/0) and
        installs courier's own span processor, because the Erlang SDK cannot
        start one (lib/courier/span_collector.ex). No meter exists in that SDK
        at all — courier cannot emit metrics from its own code, and says so in
        its own module docs rather than implying the gap is a choice.
    # 503 IS TWO CONVENTIONS AND COURIER IS IN BOTH. `POST /v1/messages` and
    # `POST /inbound/resend` answer 503 `unavailable` when the provider refuses,
    # which is core's reserved code for a customer operation
    # (docs/openapi-conventions.md, "Error envelope") and a distinct fact from
    # `/readyz` answering 503, which is core's probe convention
    # (schemas/telemetry/probes.schema.json). The shared number is not a shared
    # meaning: D14 rejected the status code as an `error.type` class precisely
    # because "a 503 from a dead provider" and "a 503 from a dead database" are
    # different incidents with different responders, and courier's is
    # `dependency_unavailable`. Nothing in core encoded the conflation, so there
    # was nothing to correct; it is recorded here so a reader does not infer the
    # other one.

  - name: muse
    repository: git@github.com:cafaye/muse.git
    manifest: cafaye.yml
    branch: master
    sourceCommit: 53b6ebb1947eeb1ff90a4cfaff75897f358dc2e9
    # `exposes.api`, transcribed. Read at the commit above; the pointer has been
    # in the manifest since 899156b, the packet that added the outbox publisher
    # and the contract files.
    api: openapi/v1.yaml
    events:
      - muse.tokens.consumed
    notes: >-
      One type, emitted on every served completion. The action `consumed` is not
      in core's v0 action vocabulary and the payload carries no account, so both
      are open questions against core rather than facts about muse.
    telemetry:
      endpointVariable: MUSE_OTEL_ENDPOINT
      signals: [traces]
      probes: true
      notes: >-
        Traces, and the reason core's redaction boundary is not theoretical:
        muse reads MUSE_OTEL_EXPORTER_OTLP_ENDPOINT (the OTel standard
        spelling) and ALLOWED_SPAN_ATTRIBUTES, with the canary at
        tests/test_trace_propagation.py. Core's contract is
        `<SERVICE>_OTEL_ENDPOINT`; see D16 in DECISIONS.md. Its error.type is
        still the exception class name ProviderAuthError rather than a member
        of core's vocabulary, which is why the documentation says an error
        dashboard groups three of the four exporters and not this one.

  - name: gateway
    repository: git@github.com:cafaye/gateway.git
    manifest: cafaye.yml
    branch: master
    # Moved off c1b328e, which is the PRE-rename commit and an ancestor of this
    # one. That is not a cosmetic staleness: the rename changed the manifest's
    # bytes, so the row was naming a tree that no longer describes this service.
    # Measured both sides rather than assumed — `git cat-file -s c1b328e:openapi/
    # v1.yaml` is 60222, `git cat-file -s 15cf59b:openapi/v1.yaml` is 61318.
    #
    # Moved a second time, 15cf59b -> 1704270, for the same reason: 1704270
    # changed the manifest's BYTES, not just the repository's name. gateway's own
    # `cafaye.yml` still said `url: git@github.com:cafaye/guard.git` after the
    # rename — correct while only the service had been renamed, stale the moment
    # the repository itself was. This row points at a manifest, so a manifest
    # that changed under it is exactly what makes the row wrong.
    # 1704270 is on origin/master and `git ls-remote` answers that full hash, so
    # both values this comment has ever named are checkable by anyone who can
    # clone the repository.
    sourceCommit: 17042701669436b625c6039c6873e43b204bdb16
    # No `api`, because the manifest declares no `exposes` at all — verified at
    # the commit above, not carried over from an older read. The FINDING is
    # below: gateway ships the document and does not name it, so recording the
    # path here would be core asserting a field gateway does not have.
    events: []
    notes: >-
      Publishes nothing, and declares no `exposes` at all. Its own manifest
      records that as a known gap with a DECISION NEEDED, since it does serve
      traffic. FINDING, re-read 2026-10-01: gateway now HAS an OpenAPI 3.1
      document on disk at `openapi/v1.yaml` and still names no `exposes.api`, so
      the gap is narrower than the manifest's own note says — the document is the
      part that was missing, and it is no longer missing. Core's contract harness
      reports this as `openapi.not-declared` rather than as a finding, because a
      file beside a manifest that nothing points at is a warning and not a
      failure. The fix is one line in gateway's cafaye.yml. Listed here anyway: a
      fleet declaration that only named services with events would not be a
      declaration about the fleet.
    telemetry:
      endpointVariable: GATEWAY_OTEL_ENDPOINT
      signals: []
      probes: true
      notes: >-
        Serves traffic on the public edge and declares no `exposes` at all, so
        the probes are the only contract surface it declares today — which is
        not the same as the only one it HAS, per the finding above. `signals: []`
        means gateway exports nothing of its own, not that nothing is deployed to
        receive what it would export; see the file header.
