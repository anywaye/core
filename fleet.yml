
spec: "0.2"

readOn: "2026-10-07"

services:
  - name: identity
    repository: git@github.com:anywaye/identity.git
    manifest: anywaye.yml
    branch: master
    sourceCommit: 608fa9afa5cb1704c3c85bde2e1c81aab9f1dbf2
    api: openapi/v1.yaml
    events:
      - identity.api_key.created
      - identity.api_key.revoked
      - identity.mfa.disabled
      - identity.mfa.enabled
      - identity.oidc_client.created
      - identity.oidc_client.revoked
      - identity.session.revoked
      - identity.user.created
      - identity.user.email_verified
    cataloguedOnly:
      - identity.account.created
      - identity.member.invited
      - identity.member.joined
      - identity.member.removed
      - identity.member.role_changed
    notes: >-
      The manifest declares NINE types and this entry now records all nine as
      published, which is the first time it has been true: it previously recorded
      one as published and eleven as catalogued-only, and eight of those eleven
      were both published by identity and marked as promises nobody had made
      good. core-23 paid that debt — eight payload schemas read out of identity's
      own event builders in `internal/outbox/`, plus the two catalog rows the
      `identity.oidc_client.*` types never had, which is why
      `test_every_published_fleet_event_has_a_catalog_row_and_a_payload_schema`
      can now assert what it was written to assert across the whole fleet. The
      `pendingCoreContract` key is DELETED rather than left as an empty list,
      because a list nobody is in is not a fact about the fleet; the schema
      property, the file header and the three assertions stay, for the next
      debtor, and D34 is the argument for the list rather than for deleting it.
      The five in `cataloguedOnly` are the mirror and are untouched: catalogued
      in core, declared nowhere in identity, and five more that identity's code
      emits (`identity.account.created`, `identity.member.invited`,
      `identity.member.accepted`, `identity.member.removed`,
      `identity.member.role_changed`) are undeclared in the manifest so that
      `caf contract lint` stays quiet until core has rows for them. `member.accepted`
      has no catalog row at all under that name; core calls the fact
      `identity.member.joined`, and the divergence is recorded rather than
      resolved (see D9 in courier's DECISIONS.md and this file's event-naming doc).
      The `sourceCommit` below MOVED to e31d030 on 2026-10-07 (packet
      identity-w25-payloads), and the move is the point rather than an
      oversight: identity's builders were re-read at that commit, the nine
      types are unchanged, and eight of the nine schemas still describe
      their builders. The ninth, `identity.session.revoked`, had gained an
      `email` field — both notices it triggers are mailed and the fleet's
      consumer is cross-service, so the address travels in the payload
      (REPORT-courier-consumer-invite-01 §2.6) — and its payload schema
      was extended to match, the first edit to a core-23 schema.
    telemetry:
      endpointVariable: IDENTITY_OTEL_ENDPOINT
      signals: [traces]
      probes: true
      notes: >-
        Serves HTTP, so it owes the healthz/readyz split in
        schemas/telemetry/probes.schema.json. Traces only, and read at
        4e6f577 on 2026-10-01: the SDK landed in afb457d, which builds a
        batched tracer over an OTLP/HTTP exporter
        (internal/telemetry/telemetry.go, sdktrace.NewTracerProvider with
        sdktrace.WithBatcher) and collapses an error class outside core's
        thirteen to _OTHER. No meter is installed, so metrics are not exported
        from this service. IDENTITY_OTEL_ENDPOINT wins, with
        OTEL_EXPORTER_OTLP_ENDPOINT honoured as the fallback.

  - name: billing
    repository: git@github.com:anywaye/billing.git
    manifest: anywaye.yml
    branch: master
    sourceCommit: 7133643d8eebb4dd5de2d8df34c7ba20fda89f79
    api: openapi/v1.yaml
    events:
      - billing.customer.created
      - billing.payment.failed
      - billing.payment.succeeded
      - billing.plan.created
      - billing.plan.updated
      - billing.subscription.canceled
      - billing.subscription.started
      - billing.subscription.updated
    cataloguedOnly:
      - billing.subscription.past_due
      - billing.payment.refunded
      - billing.invoice.created
      - billing.usage.recorded
    notes: >-
      Three types come from model callbacks and five from the Stripe webhook
      mapping, and the manifest deliberately names no catalogued type this build
      never publishes. billing.plan.updated is the one type that reached master
      with no core catalog row at all; core now has one, landed with the payload
      schemas and a catalog assertion that would have caught it.
      FINDING, core-26, and it is a disagreement in BOTH directions:
      (app/services/subscriptions/lifecycle.rb:353) writes `plan_id` and
      `account_id` as bare uuids onto all three subscription payloads, which
      core's three schemas do not name, and core's schemas require `processor`,
      `processor_event_id`, `kind` and `customer_id`, which billing never
      sends. billing grew `subscriptions`
      (db/migrate/20260930000007_create_subscriptions.rb) after D10 was written
      and knows both halves — PENDING_PAYLOAD_ALIGNMENT in
      test/contract/outbox_envelope_contract_test.rb:66-88 is asserted in both
      directions. A real `billing.subscription.started` does not validate against
      core's schema for it. D39; core's own claims were corrected in core-26 and
      the schemas are not, which is a manager's call.
      RE-READ 2026-10-02 at the same commit, still billing's HEAD, for the
      RESOURCE: `Kit::Telemetry.resource/1` (lib/kit/telemetry.rb:180-201) sets
      `telemetry.sdk.name` and `.language` BY HAND, so billing is a second
      publisher of the attributes D40 adds. Its own comment says `.create`
      merges the SDK's default resource and so reports a `process.pid`; on the
      installed SDK (1.13.1, measured) it does not merge and there is no
      `process.pid`, so that stays off core's allowlist and billing owes the
      comment a correction.
      RE-READ 2026-10-07 at 7133643 (billing's W43 merge, the commit this entry's
      `sourceCommit` now records), for the RECIPIENT FACT: billing's money events
      gained `email` and the three subscription events gained `plan_name`, and
      the five payload schemas were extended to declare them — `email` optional
      and never null (the producer merges it only when the customer has an
      address), `plan_name` required and non-empty (written unconditionally from
      the plan row the builder has already resolved). The three catalogue
      schemas (customer/created, plan/created, plan/updated) were re-read at the
      same commit and confirmed unchanged: their `as_json` producers are
      byte-identical between 7251993 and 7133643, verified by diff. The id
      shapes above are unchanged. What D39 records is untouched: the three
      subscription schemas still do not declare `account_id`, `currency`,
      `plan_id`, `started_at` or `processor_subscription_id`, and a real
      subscription event still does not validate against them — that decision is
      still the manager's, and this packet does not make it.
    telemetry:
      endpointVariable: BILLING_OTEL_ENDPOINT
      signals: [traces]
      probes: true
      notes: >-
        Traces only, read at 7251993 on 2026-10-01; the SDK landed in a42a5f8,
        which installs a tracer provider with a simple span processor over the
        OTLP exporter (lib/kit/tracer_installer.rb) and an outermost request
        middleware that opens the span
        (lib/middleware/request_telemetry.rb). No meter, so no metrics from this
        service. FINDING, not a correction: its error.type vocabulary is three
        values of its own (lib/kit/telemetry.rb) and none is in core's
        thirteen, so a billing error span would fail
        schemas/telemetry/traces.schema.json. billing owns that fix.

  - name: courier
    repository: git@github.com:anywaye/courier.git
    manifest: anywaye.yml
    branch: master
    sourceCommit: a8f15ccef11bd6148c71fbe38327d9fbebbfe2e2
    api: openapi.yaml
    events:
      - courier.email.bounced
      - courier.email.complained
      - courier.email.delivered
      - courier.email.queued
      - courier.notification.suppressed
    notes: >-
      Declares all five; publishes four. `courier.email.delivered` is written to
      `outbox_events` by `Courier.Deliver` in the transaction that sent the mail
      (lib/courier/deliver.ex). `courier.email.bounced` and
      `courier.email.complained` are written by `Courier.InboundReports` in the
      SAME transaction as the suppression row they belong to, chosen by that
      row's state — `:undeliverable` for a bounce, `:suppressed` for a complaint
      (lib/courier/inbound_reports.ex, `attrs/1`), so there is no suppression
      without the announcement. Those two had builders and no caller until
      courier-22c wired `POST /inbound/resend`.
      `courier.notification.suppressed` had a builder and NO caller until the
      one-click unsubscribe endpoint gave it one:
      `Courier.Unsubscribes.publish/1` (lib/courier/unsubscribes.ex:479-495)
      writes the row in the same transaction as the `notification_preferences`
      row that turned the type off, with `reason: preference_off`, the subject
      set to the user and no `message_id` — which is core's D8 and exactly what
      `schemas/events/courier/notification/suppressed.schema.json` requires. It
      is still not called for a *refused* send: `Courier.Deliver`'s moduledoc
      still promises "no mail, no event" for `{:error, :suppressed}` and
      `{:error, {:suppressed_address, _}}`, and courier says in its own source
      that it did not change that sentence. So the count is four of five.
      The one still declared-and-unimplemented is `courier.email.queued`: no
      builder, because the send path is synchronous and has no backlog to
      measure. core-26 re-read courier to check whether that builder existed under
      another name and recorded the answer — see the three files below.
      **This entry's `sourceCommit` has NOT been moved, and the note above reads
      courier's master at `ae8a660`, which is past it.** core-26 read
      `lib/courier/events.ex`, `lib/courier/unsubscribes.ex` and
      `lib/courier/deliver.ex` and the three payloads the live builders emit are
      unchanged in shape (`deliver.ex`'s `data/4` at HEAD is the same four
      fields; `inbound_reports.ex` is byte-identical between the two commits).
      It did not re-read courier's OpenAPI document, its telemetry configuration
      or the rest of its surface, so claiming the whole registry was read at
      `ae8a660` would be claiming a re-read nobody did. The pin and the prose are
      therefore honest about being out of step, which is the state D36's remedy
      exists for and the next courier packet should close.
      The `core:` constraint this entry used to call stale is not stale: courier
      declares `core: ^0.2.0` and mix.exs pins no anywaye dependency, so the
      manifest line is the only one there is.
    telemetry:
      endpointVariable: COURIER_OTEL_ENDPOINT
      signals: [traces]
      probes: true
      notes: >-
        Serves HTTP and runs both probes, and names an OpenAPI document above.
        Traces only, and read at 73c9034 on 2026-10-01: the SDK landed in
        d806bad, which configures a batch processor over
        :opentelemetry_exporter (lib/courier/telemetry.ex, sdk_config/0) and
        installs courier's own span processor, because the Erlang SDK cannot
        start one (lib/courier/span_collector.ex). No meter exists in that SDK
        at all — courier cannot emit metrics from its own code, and says so in
        its own module docs rather than implying the gap is a choice.

  - name: muse
    repository: git@github.com:anywaye/muse.git
    manifest: anywaye.yml
    branch: master
    sourceCommit: 53b6ebb1947eeb1ff90a4cfaff75897f358dc2e9
    api: openapi/v1.yaml
    events:
      - muse.tokens.consumed
    notes: >-
      One type, emitted on every served completion. The action `consumed` is not
      in core's v0 action vocabulary and the payload carries no account, so both
      are open questions against core rather than facts about muse.
    telemetry:
      endpointVariable: MUSE_OTEL_ENDPOINT
      signals: [traces]
      probes: true
      notes: >-
        Traces, and the reason core's redaction boundary is not theoretical:
        muse reads MUSE_OTEL_EXPORTER_OTLP_ENDPOINT (the OTel standard
        spelling) and ALLOWED_SPAN_ATTRIBUTES, with the canary at
        tests/test_trace_propagation.py. Core's contract is
        `<SERVICE>_OTEL_ENDPOINT`; see D16 in DECISIONS.md. Its error.type is
        still the exception class name ProviderAuthError rather than a member
        of core's vocabulary, which is why the documentation says an error
        dashboard groups three of the four exporters and not this one.

  - name: gateway
    repository: git@github.com:anywaye/gateway.git
    manifest: anywaye.yml
    branch: master
    sourceCommit: 17042701669436b625c6039c6873e43b204bdb16
    events: []
    notes: >-
      Publishes nothing, and declares no `exposes` at all. Its own manifest
      records that as a known gap with a DECISION NEEDED, since it does serve
      traffic. FINDING, re-read 2026-10-01: gateway now HAS an OpenAPI 3.1
      document on disk at `openapi/v1.yaml` and still names no `exposes.api`, so
      the gap is narrower than the manifest's own note says — the document is the
      part that was missing, and it is no longer missing. Core's contract harness
      reports this as `openapi.not-declared` rather than as a finding, because a
      file beside a manifest that nothing points at is a warning and not a
      failure. The fix is one line in gateway's anywaye.yml. Listed here anyway: a
      fleet declaration that only named services with events would not be a
      declaration about the fleet.
    telemetry:
      endpointVariable: GATEWAY_OTEL_ENDPOINT
      signals: []
      probes: true
      notes: >-
        Serves traffic on the public edge and declares no `exposes` at all, so
        the probes are the only contract surface it declares today — which is
        not the same as the only one it HAS, per the finding above. `signals: []`
        means gateway exports nothing of its own, not that nothing is deployed to
        receive what it would export; see the file header.
