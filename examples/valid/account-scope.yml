version: 1
service: example-courier

surface:
  kind: http
  sources:
    - lib/example_web/router.ex
  minimum: 7

entryPoints:
  - id: create-webhook-endpoint
    kind: http
    method: POST
    path: /v1/webhook_endpoints
    accountScoped: true
    accountFrom:
      via: require_account
      file: lib/example_web/plugs/require_account.ex
      line: 31
    registeredAt:
      file: lib/example_web/router.ex
      line: 133

  - id: show-webhook-endpoint
    kind: http
    method: GET
    path: /v1/webhook_endpoints/{id}
    accountScoped: true
    accountFrom:
      via: require_account
      file: lib/example_web/plugs/require_account.ex
      line: 31
    registeredAt:
      file: lib/example_web/router.ex
      line: 116

  - id: healthz
    kind: http
    method: GET
    path: /healthz
    accountScoped: false
    reason: public
    registeredAt:
      file: lib/example_web/router.ex
      line: 88

  - id: readyz
    kind: http
    method: GET
    path: /readyz
    accountScoped: false
    reason: public
    registeredAt:
      file: lib/example_web/router.ex
      line: 89

  - id: deliver-message
    kind: job
    name: MessageWorker
    accountScoped: true
    accountFrom:
      via: require_account
      file: lib/example/workers/message_worker.ex
      line: 22
    registeredAt:
      file: lib/example/application.ex
      line: 41