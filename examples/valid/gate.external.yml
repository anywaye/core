version: 1
name: example-database-service

gate:
  command: [bin/prime]
  miseTask: prime
  entrypoint: bin/prime
  timeoutSeconds: 1800
  proof:
    - id: unit
      match: '^([0-9]+)/[0-9]+ passed$'
      minimum: 240
    - id: database
      match: '^db-tier: ([0-9]+) tests, 0 skipped$'
      minimum: 1166

external:
  selfContained: false
  requirements:
    - kind: service
      name: PostgreSQL 17, reachable on the port docker-compose.yml publishes
      satisfy:
        command: [docker, compose, up, -d, postgres]
        unmet: the gate cannot reach the database and the tier says so instead of running
    - kind: database
      name: the test database, with every migration in migrations/ applied
      satisfy:
        command: [bin/migrate]
        unmet: relation "public.users" does not exist, and the tier fails rather than skips
    - kind: toolchain
      name: Go, the version mise.toml pins
      satisfy:
        command: [mise, install]
        unmet: 'go: command not found'

ci:
  workflow: ci/ci.yml
  invokes: [bin/prime]
