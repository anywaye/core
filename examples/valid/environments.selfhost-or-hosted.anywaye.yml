kind: service
name: example-environments
description: A service whose dependencies are self-hosted except one, to show the per-environment switch.
language: go
core: ^0.2.0

exposes:
  api: openapi/openapi.yaml

dependencies:
  - name: identity
    version: ^0.1.0
  - name: courier
    version: ^0.1.0
  - name: postgres
  - name: redis

environments:
  production:
    identity: hosted
  development:
    identity: self-hosted
    courier: self-hosted
    postgres: self-hosted
    redis: self-hosted

repository:
  url: git@github.com:anywaye/example-environments.git
  defaultBranch: master
  visibility: public

owner:
  team: identity