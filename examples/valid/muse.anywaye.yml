name: muse
description: LLM routing, credentials vault, and token metering.
language: python
core: ~0.2.0

exposes:
  api: openapi/openapi.yaml
  events:
    - muse.tokens.consumed

consumes: []

dependencies:
  - name: identity
    version: ^0.1.0
    required: false

repository:
  url: git@github.com:anywaye/muse.git
  defaultBranch: master
  visibility: public

owner:
  team: muse
  contact: muse@anywaye.com