version: 1
name: example-service

gate:
  command: ['bin/prime 2>&1 | tail -45; echo "PRIME EXIT=$?"']
  entrypoint: bin/prime
  timeoutSeconds: 900
  proof:
    - id: suite
      match: '^([0-9]+)/[0-9]+ passed$'
      minimum: 240

external:
  selfContained: true
  requirements: []

ci:
  workflow: ci/ci.yml
  invokes: [bin/prime]
