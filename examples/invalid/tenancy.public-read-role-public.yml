version: 1
service: example-public-read-public

accountScoped: true

scope:
  key: account_id
  sources:
    - migrations

entryPoints:
  - id: asset-fetch
    operation: select
    subject: assets
    enforced:
      mechanism: query-filter
      file: migrations/0001_assets.sql
      line: 22
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 39
        - id: other-account
          asserts: absent
          expects: nil
          file: tests/tenancy_test.rb
          line: 44
        - id: own-account
          asserts: present
          expects: checksum
          file: tests/tenancy_test.rb
          line: 49

rls:
  databaseEnforced: true
  identity: app.current_account()
  sources:
    - migrations
  tables:
    - table: publishers
      forced: true
      policies:
        - name: publishers_public_read
          command: select
          clause: using
          roles: [public_reader]
          constrained:
            file: migrations/0002_rls.sql
            line: 112

  publicRead:
    - table: publishers
      policy: publishers_public_read
      role: public
