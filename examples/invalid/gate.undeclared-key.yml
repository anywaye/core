version: 1
name: example-service

gate:
  command: [bin/prime]
  entrypoint: bin/prime
  timeoutSeconds: 900
  proof:
    - id: suite
      match: '^([0-9]+)/[0-9]+ passed$'
      minimum: 240

external:
  selfContained: true
  requirements: []

ci:
  workflow: ci/ci.yml
  invokes: [bin/prime]

cache:
  report: /tmp/prime.log
  restoreKeys: [prime-]
