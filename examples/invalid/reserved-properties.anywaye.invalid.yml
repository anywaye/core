# anywaye.yml — tombstones, every one of which is wrong in a different way.
#
# Rejected by schemas/anywaye.manifest.schema.json. Each mistake below is a
# reservation that LOOKS like it holds the name and does not, which is why they
# are all in one file: the failure mode this rule has to catch is a tombstone
# that reads as protection and protects nothing.
#
# 1. `InvoiceId` — not a property name. Property names are lowercase
#    snake_case, which is what `schemas/events/**` uses for every `properties`
#    key. A camelCase reservation reserves a string no generated source ever
#    carried, so the real name stays free for the reuse this block exists to
#    prevent. The tombstone would read as protection and be a comment.
#
# 2. `removedFrom: billing` — not a contract surface. A surface is an event type
#    (`<service>.<entity>.<action>`) or an OpenAPI components schema path.
#    Without it there is nothing to compare the name against, so the entry can
#    never be shown to be stale and never can be shown to be real. This is the
#    shape the checker cannot answer, and a check that cannot answer is the one
#    outcome this repository treats as the only real failure.
#
# 3. `paid_at` — attached to a surface this manifest does not publish. The
#    `billing` service publishes `billing.invoice.created`; it publishes no
#    `billing.invoice.paid`, so nothing was ever removed from it and the name is
#    not reserved at all. This is the stale entry: it will block a legitimate
#    future `paid_at` forever, and nothing reports it while it does.
#
# 4. `currency` — an undeclared key inside the entry. The block is closed with
#    `additionalProperties: false` like everything else, so a misspelled field
#    is an error rather than a field nobody read.
#
# 5. the same `customer_ref` twice — `uniqueItems` on the array. A duplicate is
#    not a second reservation, it is one entry written twice, and the shape of a
#    reservation list should not admit a mistake that changes nothing.
name: billing
description: Subscriptions, invoices and payments.
language: ruby
core: ~0.2.0

exposes:
  api: openapi/openapi.yaml
  events:
    - billing.invoice.created

consumes: []

dependencies: []

x-anywaye-reserved-properties:
  # 1 — `pattern` on `name`: not a property name.
  - name: InvoiceId
    removedFrom: billing.invoice.created
  # 2 — `pattern` on `removedFrom`: `billing` is neither an event type nor a
  #     components schema path, so there is no surface behind the name.
  - name: legacy_total
    removedFrom: billing
  # 4 — `additionalProperties`: `currency` is not a field of an entry.
  - name: subtotal_cents
    removedFrom: billing.invoice.created
    currency: usd
  # 3 — schema-conformant, and still wrong; caught by
  #     harness/reserved_check.py, not by the schema. See
  #     `examples/invalid/reserved-properties.stale.anywaye.yml`.
  - name: paid_at
    removedFrom: billing.invoice.paid
  # 5 — `uniqueItems`: the same entry twice, byte-identical, which is what makes
  #     it a duplicate rather than two reservations. A copy with the `note`
  #     reworded is a DIFFERENT entry and `uniqueItems` correctly accepts it —
  #     which is a property worth knowing: the array's duplicate check is exact
  #     equality, so it catches the double-paste and not the reworded one.
  - name: customer_ref
    removedFrom: billing.invoice.created
  - name: customer_ref
    removedFrom: billing.invoice.created

repository:
  url: git@github.com:anywaye/billing.git
  defaultBranch: master
  visibility: private

owner:
  team: billing
  contact: billing@anywaye.com
