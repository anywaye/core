name: billing
description: Subscriptions, invoices and payments.
language: ruby
core: ~0.2.0

exposes:
  api: openapi/openapi.yaml
  events:
    - billing.invoice.created

consumes: []

dependencies: []

x-anywaye-reserved-properties:
  - name: InvoiceId
    removedFrom: billing.invoice.created
  - name: legacy_total
    removedFrom: billing
  - name: subtotal_cents
    removedFrom: billing.invoice.created
    currency: usd
  - name: paid_at
    removedFrom: billing.invoice.paid
  - name: customer_ref
    removedFrom: billing.invoice.created
  - name: customer_ref
    removedFrom: billing.invoice.created

repository:
  url: git@github.com:anywaye/billing.git
  defaultBranch: master
  visibility: private

owner:
  team: billing
  contact: billing@anywaye.com
